<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AE 202 Fire Protection Review Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a drawing-sheet title block on top, a section rail on the left, one column of question cards. */
:root{
  --paper:#edf0f4; --sheet:#ffffff; --ink:#18212b; --muted:#566473; --line:#ccd4dd;
  --accent:#1d4f91; --accent-soft:#e2ebf7;
  --good:#1c7448; --good-soft:#e1f3e9; --bad:#b3261e; --bad-soft:#fbe8e6; --warn:#7d5200; --warn-soft:#fff2d2;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"IBM Plex Sans","Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f151c; --sheet:#18212b; --ink:#e6ebf0; --muted:#9aa8b6; --line:#2d3a48;
    --accent:#84b4f0; --accent-soft:#1b2e47;
    --good:#62cb95; --good-soft:#133423; --bad:#f19088; --bad-soft:#3f1f1c; --warn:#e8b955; --warn-soft:#392d11;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0f151c; --sheet:#18212b; --ink:#e6ebf0; --muted:#9aa8b6; --line:#2d3a48;
  --accent:#84b4f0; --accent-soft:#1b2e47;
  --good:#62cb95; --good-soft:#133423; --bad:#f19088; --bad-soft:#3f1f1c; --warn:#e8b955; --warn-soft:#392d11;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding:20px 16px 80px;display:flex;flex-direction:column;gap:16px}

/* title block */
.titleblock{background:var(--sheet);border:1.5px solid var(--ink);display:grid;grid-template-columns:1fr auto}
.titleblock h1{font-family:var(--display);font-weight:700;font-size:clamp(28px,5vw,44px);line-height:1.02;margin:0;padding:16px 18px;letter-spacing:.01em;text-transform:uppercase;text-wrap:balance}
.tb-cells{display:grid;grid-template-columns:repeat(2,minmax(96px,auto));border-left:1.5px solid var(--ink)}
.tb-cell{padding:8px 12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.tb-cell:nth-child(2n){border-right:0}
.tb-cell:nth-last-child(-n+2){border-bottom:0}
.tb-cell span{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tb-cell b{font-family:var(--mono);font-weight:500;font-size:15px;font-variant-numeric:tabular-nums}
@media (max-width:640px){.titleblock{grid-template-columns:1fr}.tb-cells{border-left:0;border-top:1.5px solid var(--ink)}}

/* status bar */
.status{position:sticky;top:0;z-index:5;background:var(--paper);padding:8px 0;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;border-bottom:1px solid var(--line)}
.meter{flex:1 1 220px;display:flex;flex-direction:column;gap:4px;min-width:200px}
.meter small{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line);position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent)}
.bar i.ok{background:var(--good)}
.seg{display:inline-flex;border:1.5px solid var(--ink)}
.seg button{background:var(--sheet);border:0;padding:6px 12px;font-size:14px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}

.cols{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:820px){.cols{grid-template-columns:minmax(0,1fr)}}

/* rail */
.rail{position:sticky;top:64px;display:flex;flex-direction:column;gap:4px}
.rail a{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:baseline;padding:7px 10px;text-decoration:none;color:var(--ink);border-left:3px solid transparent;font-size:14.5px;line-height:1.3}
.rail a:hover{background:var(--accent-soft)}
.rail a[aria-current="true"]{border-left-color:var(--accent);background:var(--sheet);font-weight:600}
.rail a .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.rail a .c{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:820px){
  .rail{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px;gap:6px}
  .rail a{flex:0 0 auto;grid-template-columns:auto auto auto;border-left:0;border:1px solid var(--line);background:var(--sheet);white-space:nowrap}
  .rail a[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--accent)}
}

main{display:flex;flex-direction:column;gap:14px;min-width:0}
.sec-head{display:flex;flex-direction:column;gap:4px}
.sec-head h2{font-family:var(--display);font-weight:600;font-size:30px;line-height:1.1;margin:0;text-transform:uppercase;letter-spacing:.01em;text-wrap:balance}
.sec-head p{margin:0;color:var(--muted);max-width:65ch}

.card{background:var(--sheet);border:1px solid var(--line);padding:16px 18px;display:flex;flex-direction:column;gap:12px;scroll-margin-top:76px}
.card.right{border-left:4px solid var(--good)}
.card.wrong{border-left:4px solid var(--bad)}
.qmeta{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.qnum{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;margin-right:4px}
.pill{font-family:var(--mono);font-size:11px;letter-spacing:.03em;padding:2px 7px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.src{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.pill.blank{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.pill.ok{background:var(--good-soft);border-color:transparent;color:var(--good)}
.pill.no{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.prompt{margin:0;font-size:17px;font-weight:500;max-width:68ch}
.opts{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;border:0}
.opt{display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:start;padding:8px 10px;border:1px solid var(--line);cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt input{margin:4px 0 0;accent-color:var(--accent)}
.opt.locked{cursor:default}
.opt.locked:hover{border-color:var(--line)}
.opt.is-right{background:var(--good-soft);border-color:var(--good)}
.opt.is-wrong{background:var(--bad-soft);border-color:var(--bad)}
.opt.is-right:hover{border-color:var(--good)}.opt.is-wrong:hover{border-color:var(--bad)}
.numrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.numrow input{width:160px;padding:8px 10px;border:1.5px solid var(--ink);background:var(--sheet);font-family:var(--mono);font-variant-numeric:tabular-nums}
.numrow span{font-family:var(--mono);font-size:14px;color:var(--muted)}
textarea{width:100%;min-height:74px;padding:8px 10px;border:1px solid var(--line);background:var(--sheet);resize:vertical}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{background:var(--ink);color:var(--sheet);border:1.5px solid var(--ink);padding:7px 14px;font-size:14.5px;font-weight:500;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.good{background:var(--good);border-color:var(--good);color:var(--sheet)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.fb{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.fb p{margin:0;max-width:68ch}
.fb .ans{font-family:var(--mono);font-size:14px}
.fb .lab{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.figwrap{display:flex;flex-direction:column;gap:4px}
.fig{border:1px solid var(--line);background:var(--paper);overflow-x:auto;padding:8px}
.fig svg{display:block;width:100%;height:auto;margin:0 auto}
.figcap{margin:0;font-family:var(--mono);font-size:12px;color:var(--muted)}
.fig .fl{fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fig .fw{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.fig .fb{fill:none;stroke:var(--muted);stroke-width:1.5}
.fig .fx{fill:none;stroke:var(--ink);stroke-width:4}
.fig .ff{fill:var(--sheet);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
.fig .fk{fill:var(--ink)}
.fig .fd{fill:none;stroke:var(--muted);stroke-width:1.5;stroke-dasharray:5 4}
.fig .fa{fill:var(--accent)}
.fig .fflame{fill:var(--bad)}
.fig .gap{stroke:var(--paper);stroke-width:6}
.fig .gr{stroke:var(--line);stroke-width:1}
.fig .ax{stroke:var(--muted);stroke-width:1.5;fill:none}
.fig .pt{fill:var(--accent);stroke:var(--paper);stroke-width:2}
.fig .ft{fill:var(--muted);font:12px var(--mono)}
.fig .lead{stroke:var(--accent);stroke-width:1.5;fill:none}
.hs circle{fill:var(--sheet);stroke:var(--accent);stroke-width:2}
.hs text{fill:var(--accent);font:600 13px var(--mono);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.hs.live{cursor:pointer}
.hs.live:hover circle{fill:var(--accent-soft)}
.hs.sel circle{fill:var(--accent)}.hs.sel text{fill:var(--sheet)}
.hs.ok circle{fill:var(--good);stroke:var(--good)}.hs.ok text{fill:var(--sheet)}
.hs.no circle{fill:var(--bad);stroke:var(--bad)}.hs.no text{fill:var(--sheet)}
.hs:focus{outline:none}.hs:focus-visible circle{stroke-width:4}
.hs circle.hit{fill:transparent!important;stroke:none!important}
.panel{background:var(--sheet);border:1px solid var(--line);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.panel h3{font-family:var(--display);font-weight:600;font-size:21px;text-transform:uppercase;margin:0;letter-spacing:.02em}
.panel p,.panel li{max-width:68ch}
.panel p{margin:0}
.panel a{color:var(--accent)}
.panel ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td .bar{min-width:90px}
.bigscore{display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline}
.bigscore b{font-family:var(--display);font-weight:700;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.bigscore span{color:var(--muted)}
.missed{display:flex;flex-direction:column;gap:0}
.missed button{all:unset;cursor:pointer;display:grid;grid-template-columns:64px 1fr;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line)}
.missed button:hover{background:var(--accent-soft)}
.missed button:focus-visible{outline:2px solid var(--accent)}
.missed .k{font-family:var(--mono);font-size:12px;color:var(--muted)}
.next{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="wrap">
  <header class="titleblock">
    <h1>AE 202 Fire Protection Review Test</h1>
    <div class="tb-cells">
      <div class="tb-cell"><span>Questions</span><b id="tbQ">0</b></div>
      <div class="tb-cell"><span>Sections</span><b id="tbS">0</b></div>
      <div class="tb-cell"><span>Sources</span><b>7 lectures</b></div>
      <div class="tb-cell"><span>Score</span><b id="tbScore">0 / 0</b></div>
    </div>
  </header>

  <div class="status">
    <div class="meter">
      <small id="meterText">Answered 0</small>
      <div class="bar" aria-hidden="true"><i id="meterBar" style="width:0%"></i></div>
    </div>
    <div class="seg" role="group" aria-label="Test mode">
      <button type="button" id="modeStudy" aria-pressed="true">Study: check as you go</button>
      <button type="button" id="modeExam" aria-pressed="false">Exam: grade at the end</button>
    </div>
  </div>

  <div class="cols">
    <nav class="rail" id="rail" aria-label="Sections"></nav>
    <main id="main"></main>
  </div>
</div>

<script>
"use strict";
var SRC={
  S10:"Lec 10.1 Statistics",
  L10:"Lec 10.2 Principles",
  C10:"Lec 10.2 Codes",
  L11:"Lec 11.1a Systems I",
  L12:"Lec 11.1b Systems II",
  FA:"Lec 11.2 Fire alarm",
  JPA:"Lec 12.1 guest slides"
};
/* mc: first option is the correct one (display order is shuffled).
   ms: the first c options are correct. tf: a is true or false.
   num: a is the answer, tol the tolerance, u the unit. sa: m is the model answer, self-graded.
   b:1 marks an answer that fills a blank left empty in the uploaded notes. */
var SECTIONS=[
{id:"theory",name:"Fire theory and extinguishment",blurb:"Combustion, the heat balance, and the seven ways the notes list for putting a fire out.",qs:[
{s:"L10",t:"mc",q:"The notes define combustion as a continuous reaction that combines a fuel with an oxidizing agent. In that reaction the fuel is the:",o:["Reducing agent","Oxidizing agent","Catalyst","Inhibitor"],e:"The fuel is the reducing agent. It combines with an oxidizing agent, the most prominent of which is oxygen."},
{s:"L10",t:"mc",q:"In the non-flaming mode of combustion (glowing, deep-seated embers), the fuel is in the form of:",o:["An incandescent solid","A vapor","A liquid film","Free radicals"],e:"Non-flaming: the fuel is an incandescent solid. Flaming: the fuel is a vapor, burning as an uninhibited chain reaction."},
{s:"L10",t:"mc",q:"Which mode of combustion is associated with high burning rates, including explosion?",o:["Flaming","Non-flaming","Glowing","Deep-seated"],e:"The flaming type is tied to high burning rates, up to and including explosion."},
{s:"L10",t:"mc",q:"The combustion process is a balance between heat generated (+) and heat lost to the environment (−). What happens when the heat loss is excessive?",o:["The fire dies down","The fire continues","The fire changes from glowing to flaming","Flash-over follows"],e:"If heat generated is excessive, the fire continues. If heat loss is excessive, it dies down."},
{s:"L10",t:"mc",q:"How does the heat generated by a fire split between sensible heat of the effluent and radiant heat flux?",o:["2/3 sensible heat of effluent, 1/3 radiant heat flux","1/3 sensible heat of effluent, 2/3 radiant heat flux","Half and half","1/10 sensible heat of effluent, 9/10 radiant heat flux"],e:"Heat generated: 2/3 sensible heat of effluent and 1/3 radiant heat flux."},
{s:"L11",p:1,t:"ms",c:4,q:"Lecture 11.1a gives four reasons water is used for fire suppression. Select all four.",o:["Low cost","It is available","It removes 970 BTU/lb when it vaporizes","Volumetric expansion","It does not conduct electricity","It chemically inhibits the flame"],e:"Cost (low), available, removes 970 BTU/lb to vaporize, and volumetric expansion."},
{s:"L11",p:1,t:"num",a:970,tol:0,u:"BTU/lb",q:"How much heat does one pound of water remove as it vaporizes?",e:"970 BTU/lb, the latent heat of vaporization."},
{s:"L10",t:"mc",q:"When cooling a fire with water, why do the notes caution about a straight hose?",o:["The hose stream is too forceful","It delivers too little water","It cannot reach the ceiling","It adds oxygen to the room"],e:"The note reads: straight hose, hose stream too forceful."},
{s:"L10",t:"mc",q:"Heat removal by water takes two forms. Which pair?",o:["Sensible heat and latent heat","Radiant heat and conductive heat","Latent heat and chemical heat","Sensible heat and radiant flux"],e:"Sensible heat (1 Btu per °F per lb) as the water warms, and latent heat (970 BTU/lb) as it turns to steam."},
{s:"L10",t:"num",a:1,tol:0,u:"Btu per °F per lb",q:"How much sensible heat does a pound of water absorb for each degree Fahrenheit it warms?",e:"1 Btu/°F·lb. Compare that with 970 BTU/lb of latent heat: vaporizing the water does most of the cooling."},
{s:"L10",t:"num",a:2500,tol:0,u:": 1",q:"Per the Lecture 10.2 notes, water turning to steam expands at a volumetric ratio of how much to 1?",e:"The notes give 2500:1."},
{s:"L10",t:"mc",q:"How does that volumetric expansion help put the fire out?",o:["The steam displaces oxygen around the fire","It raises the ignition temperature of the fuel","It ties up free radicals","It removes the fuel"],e:"The expanding steam displaces O₂. A water stream can also induce ventilation, which is used during firefighting."},
{s:"L10",t:"ms",c:2,q:"Fire extinguishers add surfactants or alkali carbonate to water. What do those additives do? Select all that apply.",o:["Retard run-off","Prolong soaking","Increase volumetric expansion","Tie up O*, OH* and H* radicals"],e:"They retard run-off and prolong soaking, so the water stays on the fuel."},
{s:"L10",t:"num",a:20.9,tol:0.1,u:"%",q:"What percentage of air is oxygen, per the notes?",e:"Air is 20.9% oxygen. Oxygen dilution works by pushing the level around the fire below what the fuel needs."},
{s:"L10",t:"ms",c:2,q:"Which agents do the notes list under extinguishing by oxygen dilution?",o:["Water / steam","CO₂","Halon 1301","Surfactants"],e:"Water/steam and CO₂. Halon 1301 works by chemical flame inhibition."},
{s:"L10",t:"mc",q:"Which set of minimum oxygen requirements matches the slides?",o:["Wood 4%, acetylene under 4%, hydrocarbon gases 15%","Wood 15%, acetylene 4%, hydrocarbon gases under 4%","Wood 20.9%, acetylene 15%, hydrocarbon gases 4%","Wood under 4%, acetylene 15%, hydrocarbon gases 4%"],e:"4% wood, under 4% acetylene, 15% hydrocarbon gases. Oxygen dilution has to push the level around the fire below these values."},
{s:"L10",t:"num",a:15,tol:0,u:"% oxygen",q:"Hydrocarbon gases need at least what oxygen concentration to keep burning?",e:"15%. Air is 20.9% oxygen, so a fairly small dilution stops a hydrocarbon gas flame, while wood and acetylene keep going down to about 4%."},
{s:"L10",t:"mc",q:"Limiting the combustibles kept in a building is an example of extinguishing by:",o:["Fuel removal","Oxygen dilution","Cooling","Chemical flame inhibition"],e:"Fuel removal: limit combustibles in the building. The slides tie this to fire loading."},
{s:"L10",t:"tf",a:false,q:"Chemical flame inhibition works equally well on flaming and glowing combustion.",e:"False. It applies to the flaming mode only and puts out a glowing fire only after long periods of exposure."},
{s:"L10",t:"mc",q:"Halon 1301 is:",o:["CBrF₃, bromotrifluoromethane","CO₂, carbon dioxide","CCl₄, carbon tetrachloride","CF₃I, trifluoroiodomethane"],e:"Halon 1301 is CBrF₃, bromo-trifluoro-methane."},
{s:"L10",t:"mc",q:"How does Halon 1301 extinguish a flame?",o:["It ties up the O*, OH* and H* radicals","It absorbs latent heat as it vaporizes","It dilutes oxygen below 15%","It coats the fuel surface"],e:"It ties up the O*, OH* and H* radicals that keep the flame reaction going."},
{s:"L10",t:"mc",q:"Why are doors closed and duct openings dampered when a Halon system discharges?",o:["The agent has to build up to its required concentration","To keep the agent from freezing the ducts","To protect the fire department connection","To keep the sprinklers from activating"],e:"A concentration level must develop in the room, so openings are closed off."},
{s:"L10",t:"ms",c:3,q:"The notes ask “extinguished by whom?” Occupants can put out a fire only under which conditions?",o:["If they are there","If they are trained","If they can detect the fire","If the building is a high-rise","If the fire department approves"],e:"If we are here, if we are trained, and if we can detect the fire."},
{s:"L10",t:"num",a:5,tol:0,u:"minutes",q:"Alpha Fire Company can have its first people on the scene in how many minutes?",e:"5 minutes. Response time is the limit on fire department extinguishment."},
{s:"L10",t:"mc",q:"Automatic extinguishment has two parts. Which?",o:["Detection and suppression","Detection and evacuation","Containment and ventilation","Annunciation and egress"],e:"Automatic: detection, then suppression."}
]},
{id:"growth",name:"Fire growth and safety analysis",blurb:"Stages of a fire, flame movement, smoke movement, and the three protection objectives.",qs:[
{s:"L10",t:"mc",q:"What happens in overheat, the first stage of a fire?",o:["Heat energy decomposes the fuel and volatilizes gases","A 10-inch flame becomes established","Flames reach the ceiling","All combustibles in the room burn"],e:"Overheat: heat energy decomposes a fuel and volatilizes the gases. Ignition comes next."},
{s:"L10",t:"ms",c:3,q:"Ignition needs a heat source strong enough to start self-sustained flaming or smoldering. Which ingredients do the notes list?",o:["Heat flux of sufficient intensity and duration","An ignitable fuel","The heat flux and the fuel coming together","A flame at least 10 inches tall","Oxygen above 20.9%"],e:"Heat flux intensity and duration, ignitable fuel, and the coming together of the two."},
{s:"L10",t:"mc",q:"Why does a 10-inch flame mark a stage of fire growth?",o:["Feedback changes from mostly conductive and convective to mostly radiative","It is the height at which sprinklers activate","Occupants can no longer put the fire out","It marks full room involvement"],e:"At a 10-inch flame, feedback shifts from primarily conductive and convective to predominantly radiative."},
{s:"L10",t:"mc",q:"Which stage is defined by a 10-inch flame?",o:["Established burning","Sustained burning","Ignition","Flame at ceiling"],e:"Established burning is a 10-inch flame, where feedback turns predominantly radiative."},
{s:"L10",t:"mc",q:"A single, isolated stuffed chair burning with a flame 6 ft high is the benchmark for which stage?",o:["Sustained burning","Established burning","Flame at ceiling","Full room involvement"],e:"Sustained burning: fire of a single, isolated, stuffed chair, 6 ft high."},
{s:"L10",t:"mc",q:"Two stuffed chairs burning is the benchmark for which stage?",o:["Flame at ceiling","Sustained burning","Established burning","Overheat"],e:"Flame at ceiling: fire of two stuffed chairs."},
{s:"L10",t:"mc",q:"What is the other name for full room involvement, and what defines it?",o:["Flash-over: all combustibles in the room are burning","Backdraft: the room runs out of oxygen","Overheat: the fuel begins to decompose","Churn: the fire stops growing"],e:"Full room involvement (flash-over) is the condition in which all combustibles in the room are burning."},
{s:"L10",t:"mc",q:"In the fire growth notes, feedback means:",o:["Preheating of a fuel before it burns","The flow switch signal to the alarm panel","Smoke recirculating through the HVAC system","Heat lost to the environment"],e:"Feedback is the preheating of a fuel before it burns."},
{s:"L10",t:"mc",q:"Which list gives the six stages of fire in order?",o:["Overheat → ignition → established burning → sustained burning → flame at ceiling → full room involvement","Ignition → overheat → sustained burning → established burning → flame at ceiling → full room involvement","Overheat → ignition → sustained burning → established burning → full room involvement → flame at ceiling","Ignition → established burning → overheat → flame at ceiling → sustained burning → full room involvement"],e:"Overheat, ignition, established burning (10-inch flame), sustained burning (one chair, 6 ft flame), flame at ceiling (two chairs), full room involvement (flash-over)."},
{s:"L10",t:"mc",q:"What does the flame do after it reaches the ceiling?",o:["Spreads out and radiates downward, preheating other fuels","Self-terminates for lack of fuel","Switches to conductive feedback","Cools the smoke layer"],e:"It spreads across the ceiling and radiates downward to preheat other fuels, which drives the room toward full involvement."},
{s:"L10",t:"ms",c:3,q:"A building fire safety analysis begins by defining the fire safety objective. It addresses the degree of safety afforded to which three things?",o:["People (life safety)","Property","Continuity of operations","Insurance premiums","Construction schedule"],e:"People protection (life safety), property protection, and continuity of operations protection."},
{s:"L10",t:"mc",q:"Where does fire prevention sit in the analysis?",o:["Before the building is threatened, through public awareness","After detection and before suppression","After full room involvement","Once the fire department arrives"],e:"Fire prevention is public awareness, before the building is threatened."},
{s:"L10",t:"ms",c:4,q:"Which four items make up the flame movement analysis?",o:["Fire growth hazard potential","Automatic suppression","Manual suppression","Barrier effectiveness","Stack effect","HVAC operation"],e:"Fire growth hazard potential, automatic suppression, manual suppression, barrier effectiveness. Stack effect and HVAC belong to smoke movement."},
{s:"L10",t:"mc",q:"Fire growth hazard potential asks one key question. Which?",o:["Will the fire self-terminate?","How many occupants are in the room?","What is the U.L. rating of the walls?","How far away is the nearest hydrant?"],e:"Consider whether the fire will self-terminate."},
{s:"L10",t:"ms",c:6,q:"Which factors set the fire growth hazard potential? Select all six.",o:["Fuel continuity and configuration","Ignitability","Thermal inertia","Surface roughness","Thickness","Surface area","U.L. rating of the walls","Stack effect"],e:"Fuel (continuity and configuration), ignitability, thermal inertia, surface roughness, thickness and surface area."},
{s:"L10",t:"mc",q:"Automatic suppression is judged by its area of coverage and its ability to:",o:["Contain the fire to the room of origin","Protect only the structural frame","Pressurize the stairs","Replace the fire department"],e:"Area of coverage, and contain to room of origin."},
{s:"L10",t:"mc",q:"Manual suppression by occupants depends on:",o:["Immediate detection","A fire pump","A Class I standpipe","HVAC shutdown"],e:"It depends on immediate detection."},
{s:"L10",t:"ms",c:3,q:"Under barrier effectiveness, which items protect openings in a rated barrier?",o:["Fire-rated doors","Fire dampers","Fusible links","Flow switches","Jockey pumps"],e:"Opening protection: fire-rated doors, fire dampers, fusible links."},
{s:"L10",t:"tf",a:false,q:"Once an assembly carries a U.L. rating, the barrier contains a fire indefinitely.",e:"False. A barrier contains fire for a period of time. The U.L. rating belongs to the tested assembly."},
{s:"L10",t:"mc",q:"In the structural frame analysis, what does the frame do and how does it fail?",o:["It supports the structure and the barriers, and fails by deflection or collapse","It contains smoke and fails by leakage","It feeds the standpipes and fails by pressure loss","It provides egress and fails by blockage"],e:"The frame supports the structure and supports the barriers. Failure is due to deflection or collapse. It carries a U.L. (Underwriter Laboratory) rating."},
{s:"L10",t:"ms",c:4,q:"Which forces move smoke through a building?",o:["Buoyancy / pressure","Stack effect","Wind","HVAC","Latent heat","Velocity pressure at the hydrant"],e:"Buoyancy/pressure, stack effect, wind, and HVAC."},
{s:"L10",t:"ms",c:3,q:"Which three HVAC operations are used against smoke?",o:["Dilution","Pressurization","Exhaust (smoke purge)","Recirculation","Economizer mode"],e:"HVAC operations: dilution, pressurization, and exhaust (smoke purge)."},
{s:"L10",t:"mc",q:"Smoke movement analysis is concerned with conditions:",o:["Before the building or parts of it become untenable","After structural collapse","Only inside the room of origin","Only after sprinklers operate"],e:"The analysis looks at smoke before the building or parts of the building become untenable."},
{s:"L10",t:"num",a:530,tol:0,u:"°R",q:"Convert 70°F to degrees Rankine.",e:"°R = °F + 460, so 70°F = 530°R."},
{s:"L10",t:"num",a:3.13,tol:0.2,u:"×",q:"Air at 70°F is heated by a fire to 1200°F at constant pressure. By what factor does its volume grow (V₂ / V₁)?",e:"P₁V₁/T₁ = P₂V₂/T₂ with constant pressure gives V₂/V₁ = T₂/T₁ = 1660°R / 530°R = 3.13. The notes round it to V₂ ≈ 3 V₁. This expansion is the buoyancy/pressure force."},
{s:"L10",t:"ms",c:4,q:"People protection (life safety) depends on which factors?",o:["Location of the fire","Location of the people","Physical and mental limitations","Egress","Fire pump horsepower"],e:"Location of fire, location of people, physical and mental limitations, and egress. The notes add that no building can hold up forever."},
{s:"L10",t:"ms",c:2,q:"What are the two egress objectives in the building and safety analysis?",o:["Evacuation of all occupants","Create areas of refuge","Protect the structural frame","Keep the sprinklers supplied"],e:"1. Evacuation of all occupants. 2. Create areas of refuge. The path runs exit access, exit, exit discharge."},
{s:"L10",t:"ms",c:3,q:"The building fire safety diagram splits a fire into thermal products (heat, flame) and non-thermal products (gases, smoke). Which three analyses follow from it?",o:["Flame movement analysis","Structural safety analysis","Smoke movement analysis","Hydraulic analysis","Occupancy analysis"],e:"Flame movement analysis, structural safety analysis and smoke movement analysis."},
{s:"L10",t:"mc",q:"Per the lecture, codes are what, established by society or insurance carriers for the level of risk they are willing to accept?",o:["Minimum requirements","Best practices","Targets for an ideal building","Optional guidelines"],e:"Minimum requirements. The codes lecture repeats it and adds that codes don't cover everything. Your margin note in Lecture 11.1a: the ideal goes further, the code is the minimum."},
{s:"L10",t:"tf",a:false,q:"Insurance practices and fire protection standards stay fixed once they are adopted.",e:"False. They change constantly to reflect changing building construction, changing hazards and advancing technologies."}
]},
{id:"context",name:"Statistics, causes, prevention",blurb:"Fire statistics and major fires from Lecture 10.1, then the numbers, prevention and penetration slides from the guest lecture.",qs:[
{s:"S10",t:"ms",c:2,q:"What do fire statistics do, per Lecture 10.1?",o:["Pinpoint problems","Formulate solutions","Set insurance premiums","Replace building codes"],e:"Statistics pinpoint problems and formulate solutions."},
{s:"S10",t:"ms",c:4,q:"Which four losses do fire statistics track?",o:["Life loss","Injuries","Property damage","Continuity of operation","Sprinkler discharge volume","Fire department overtime"],e:"Life loss, injuries, property damage, and continuity of operation."},
{s:"S10",t:"mc",q:"In the 1978 comparison of countries, which had the highest fire deaths per 100,000 population?",o:["United States, 3.80","Canada, 3.6","Japan, 1.6","Hong Kong, 0.64"],e:"U.S. 3.80, Canada 3.6, Japan 1.6, U.K. 1.5, Hong Kong 0.64. Japan had the most deaths per 1,000 fires at 29.8."},
{s:"S10",t:"mc",q:"When do most fire deaths occur?",o:["At night, with midnight to 4 AM the worst block at 36.8% of casualties","At midday, with noon to 4 PM at 36.8%","In the evening, with 4 PM to 8 PM at 36.8%","Evenly through the day"],e:"Most deaths occur at night. Midnight to 4 AM carries 36.8% of casualties and 4 AM to 8 AM another 19.2%."},
{s:"S10",t:"tf",a:false,q:"Non-fatal fires peak at midnight.",e:"False. Non-fatal fires peak at noon. Deaths peak at night."},
{s:"S10",t:"mc",q:"Which age groups make up the majority of fire casualties?",o:["Ages 0 to 9 and over 60","Ages 10 to 19 and 40 to 60","Ages 20 to 39","Ages 40 to 60"],e:"The majority of casualties are ages 0 to 9 and over 60."},
{s:"S10",t:"mc",q:"What is the leading cause of death in fires?",o:["Asphyxiation, 74%","Burns, 74%","Mechanical injuries, 74%","Heart attacks, 74%"],e:"Asphyxiation 74%, burns 24%, mechanical injuries 2%, heart attacks 0.5%."},
{s:"S10",t:"num",a:24,tol:0,u:"%",q:"What percentage of fire deaths are caused by burns?",e:"Burns account for 24%. Asphyxiation is far ahead at 74%."},
{s:"S10",t:"num",a:35,tol:0,u:"% of casualties",q:"Alcohol is a factor in what share of all fire casualties?",e:"35% of all casualties, on the slide that cites a 0.1% blood alcohol level."},
{s:"S10",t:"mc",q:"Where do fatal residential fires usually start, and with what?",o:["Bedrooms and living rooms, from smoking material on textile","Kitchens, from cooking oil","Garages, from gasoline","Basements, from heating equipment"],e:"Origin: bedrooms and living rooms. Cause: smoking material on textile."},
{s:"S10",t:"ms",c:4,q:"What does Lecture 10.1 conclude will save lives?",o:["Early warning","Smoke detectors and alarms","Public awareness","Care with smoking material","Larger fire pumps","Class II hose racks"],e:"Early warning through smoke detectors and alarms, and public awareness, including care with smoking material."},
{s:"S10",t:"ms",c:4,q:"The Beverly Hills Supper Club fire (Southgate, KY, May 28, 1977) killed 165. Which factors do the slides list for it?",o:["Delayed alarm","Inadequate exits","Overcrowding","Rapid fire spread","Smoke distributed by air handling equipment","Improper electric wiring"],e:"Delayed alarm, inadequate exits, overcrowding and rapid fire spread. Air handling equipment and electric wiring belong to the MGM Grand fire."},
{s:"S10",t:"ms",c:5,q:"The MGM Grand fire (Las Vegas, November 21, 1980) killed 85. Which factors do the slides list for it?",o:["Improper electric wiring","Rapid fire and smoke spread","Improper protection of vertical openings","Improper enclosed exits","Distribution of smoke by air handling equipment","Overcrowding","Delayed alarm"],e:"Improper electric wiring, rapid fire and smoke spread, improper protection of vertical openings, improper enclosed exits, and distribution of smoke by air handling equipment."},
{s:"S10",t:"mc",q:"What fed the Station Nightclub fire (West Warwick, RI, February 20, 2003), which killed 100?",o:["Band pyrotechnics ignited cheap polyurethane packing foam used as soundproofing","A kitchen grease fire spread through the exhaust hood","Faulty wiring ignited the roof structure","Smoke spread through the air handling equipment"],e:"Sparks from the band's pyrotechnics ignited low-density polyurethane packaging foam behind the stage. It was highly flammable and unsuitable as acoustic insulation."},
{s:"S10",t:"mc",q:"What did the Brunswick Building in Chicago (October 17, 2003, 6 died) lack?",o:["An alarm system and a sprinkler system, and it had a locking door system","Exit stairs","A fire department connection","Emergency lighting only"],e:"The 1960 building had no alarm system or sprinkler system, and it did have a locking door system."},
{s:"S10",t:"mc",q:"Fires started by children playing averaged how many per year from 2005 to 2009?",o:["56,300 fires, with 110 civilian deaths","5,630 fires, with 11 civilian deaths","563,000 fires, with 1,100 civilian deaths","12,500 fires, with 880 civilian deaths"],e:"An average of 56,300 fires a year, with 110 civilian deaths, 880 civilian injuries and $286 million in direct property damage. 12,500 of them were structure fires."},
{s:"JPA",t:"num",a:1.4,tol:0.05,u:"million",q:"About how many fires occur per year in the U.S.?",e:"About 1.4 million fires per year."},
{s:"JPA",t:"mc",q:"About how many people die in U.S. building fires each year?",o:["About 3,500, including about 65 firefighters","About 350, including about 65 firefighters","About 12,000, including about 650 firefighters","About 35,000"],e:"About 3,500 deaths per year in buildings, about 65 of them firefighters."},
{s:"JPA",t:"mc",q:"What share of fire deaths happen in residential buildings?",o:["About 75% (66% houses, 9% apartments)","About 40%","About 25%","About 95%"],e:"About 75% are residential: 66% in houses and 9% in apartments. Lecture 10.1 lists residential fires at 40% of casualties. The guest figure is the one to use."},
{s:"JPA",t:"mc",q:"Yearly U.S. fire injuries and property damage are about:",o:["12,000 injuries and $20 billion","3,500 injuries and $2 billion","120,000 injuries and $200 billion","1,200 injuries and $20 million"],e:"About 12,000 injuries and about $20 billion in damage per year."},
{s:"JPA",t:"ms",c:5,q:"Which leading causes of fires appear on the slides? Select all five.",o:["Cooking","Heating equipment","Electrical systems","Smoking","Open flames (candles)","Lightning","Sprinkler failure"],e:"Cooking, heating equipment, electrical systems, smoking, and open flames such as candles."},
{s:"JPA",t:"sa",q:"The guest slides ask for consideration: why are there so many deaths at home? Answer using Lecture 10.1.",m:"The guest slide leaves it open. Lecture 10.1 supplies the pieces: most deaths occur at night (36.8% between midnight and 4 AM), when people are asleep. Fires start in bedrooms and living rooms from smoking material on textile. 74% of deaths are asphyxiation. The very young (0 to 9) and the old (over 60) are the majority of casualties, and alcohol figures in 35%. Houses also lack the sprinklers, alarms and rated egress that codes require elsewhere, which is why the lecture's conclusion is early warning: smoke detectors, alarms and public awareness."},
{s:"JPA",t:"ms",c:3,q:"Which prevention measures do the slides list?",o:["Fire-rated and smoke-rated building elements","Limited storage of combustibles","Standard operating procedures","Fire pumps","Standpipes"],e:"Rated building elements, limited storage of combustibles, and standard operating procedures."},
{s:"JPA",t:"mc",q:"In practice, prevention is largely the responsibility of:",o:["Architects and owners","The sprinkler contractor","The fire department","MEP engineers alone"],e:"Largely the responsibility of architects and owners."},
{s:"JPA",t:"mc",q:"Where does the building code cover penetrations of rated construction?",o:["Chapter 7","Chapter 9","NFPA 14","NFPA 22"],e:"Penetrations are covered in Chapter 7. The slide's advice: read it, know it, and read it again each code cycle."},
{s:"JPA",t:"sa",q:"What do the slides say about your own role on a design team when it comes to penetrations and code interpretation?",m:"You may need to be the expert on the design team. Chapter 7 gets updated, so reread it each code cycle and whenever an interpretation is difficult. Many jurisdictions have competent AHJs but some do not, and you are ethically required to protect public safety."},
{s:"JPA",t:"mc",q:"The slides say one party's opinion “trumps all” on hazard classification. Who?",o:["The AHJ (authority having jurisdiction)","The architect","The insurance carrier","The sprinkler contractor"],e:"AHJ opinion trumps all. The slides repeat “check with AHJ” for hydrant distance, hose valve landings and standpipe pressure."}
]},
{id:"standpipes",name:"Standpipes",blurb:"Purpose, where required, classes, flow, riser sizing, components and hose valves.",qs:[
{s:"L11",p:1,t:"mc",q:"How do the notes distinguish the two types of water suppression?",o:["A standpipe puts water at the location it is needed. A sprinkler detects, notifies and applies the agent","A standpipe detects and notifies. A sprinkler puts water where it is needed","Both detect the fire and apply the agent","A standpipe is automatic and a sprinkler is manual"],e:"Standpipe: puts water at the location it is needed. Sprinkler: detect, notify, and apply agent."},
{s:"L11",p:1,t:"mc",q:"For standpipes, what do the IBC and NFPA 14 each tell you?",o:["IBC: where you need them. NFPA 14: how you build them","IBC: how you build them. NFPA 14: where you need them","IBC: flow test procedure. NFPA 14: sprinkler spacing","Both cover only pump sizing"],e:"IBC says where you need them. NFPA 14 says how you build them."},
{s:"L11",p:1,t:"mc",q:"First-aid hoses are:",o:["1½ in., for building occupants until the fire department arrives","2½ in., for firefighters","1½ in., for firefighters only","2½ in., for building occupants"],e:"First-aid hoses are 1½ in. and are used by building occupants until the fire department arrives."},
{s:"L11",p:1,t:"ms",c:3,q:"What are second-aid (2½ in.) hoses and valves for? Select all that apply.",o:["Firefighters fighting the fire within the building","Cases where fighting the fire from the street is unfeasible","Bringing water into the building where it is needed","Occupant use before the fire department arrives"],e:"They are for firefighters inside the building, when fighting from the street is unfeasible, and they bring water in to where it is needed."},
{s:"L11",p:1,t:"num",a:30,tol:0,u:"ft",q:"A standpipe is required when the highest floor is more than how many feet above the fire department's vehicle access?",e:"30 ft. Your margin note: the 3rd floor is about 30 ft above grade."},
{s:"L11",p:1,t:"num",a:400,tol:0,u:"ft",q:"A standpipe is also required when any area within the building is more than how many feet from the fire department's vehicle access?",e:"400 ft from the fire department's vehicle access."},
{s:"JPA",t:"ms",c:4,q:"Per the guest slides, when are standpipes needed? Select all that apply.",o:["An occupied level more than 30 ft above or below fire department access","Multi-level parking garages","Malls","Unsprinklered assembly spaces","Every building that has a fire pump","Every light-hazard office"],e:"Occupied level more than 30 ft above or below access, multi-level parking garages, malls, and unsprinklered assembly spaces."},
{s:"L11",p:2,t:"mc",q:"What makes a standpipe a dry standpipe?",o:["A permanent water connection does not exist","The pipe holds nitrogen under pressure","Water pressure is maintained all the time","Only occupants may use it"],e:"Dry standpipe: a permanent water connection does not exist. A wet standpipe has water pressure maintained all the time. Lecture 11.1a calls dry standpipes not recommended. The guest slides, which govern, use manual dry standpipes in parking garages."},
{s:"L11",p:2,t:"mc",q:"Which standpipe class is for fire department use only, with no hose provided?",o:["Class I","Class II","Class III","Class IV"],e:"Class I is for fire department use only and has no hose."},
{s:"L11",p:2,t:"mc",q:"A Class III standpipe serves:",o:["Both the fire department and occupants","Occupants only","The fire department only","Sprinkler zones only"],e:"Class II is for occupant use. Class III serves both the fire department and occupants."},
{s:"JPA",t:"mc",q:"Per the guest slides, which standpipe class is “really all that is done now”, and what are its connection size and pressure?",o:["Class I: 2.5 in. connections, 100 psi","Class II: 1.5 in. connections, 65 psi","Class III: 2.5 in. connections, 65 psi","Class I: 1.5 in. connections, 100 psi"],e:"Class I, fire department use, 2.5 in. connections at 100 psi. Class II (occupant use, 1.5 in., 65 psi) is really not done now."},
{s:"L11",p:2,t:"num",a:500,tol:0,u:"GPM",q:"What flow is required for the first standpipe?",e:"500 GPM for the first standpipe."},
{s:"L11",p:2,t:"num",a:250,tol:0,u:"GPM",q:"How much flow does each additional standpipe add?",e:"250 GPM for each additional standpipe."},
{s:"JPA",t:"mc",q:"What is the maximum standpipe flow demand?",o:["1,000 GPM in a sprinklered building and 1,250 GPM in a non-sprinklered one","2,500 GPM, reached at 9 standpipes","500 GPM sprinklered and 1,000 GPM non-sprinklered","1,250 GPM sprinklered and 1,000 GPM non-sprinklered"],e:"Guest slides: 500 GPM minimum, 250 GPM per riser, 1,000 GPM max for a sprinklered building, 1,250 GPM max for a non-sprinklered one. Lecture 11.1a shows 2,500 GPM at 9 standpipes. The guest slides are the ones to follow."},
{s:"JPA",t:"tf",a:false,q:"Standpipe flow demand is added on top of the sprinkler demand when sizing the water supply.",e:"False. The slide states this flow demand does not add to the sprinkler demand."},
{s:"L11",p:2,t:"mc",q:"What riser size do the notes give for buildings under 75 ft and over 75 ft?",o:["4 in. under 75 ft, 6 in. over 75 ft","6 in. under 75 ft, 4 in. over 75 ft","2½ in. under 75 ft, 4 in. over 75 ft","4 in. for both"],e:"Under 75 ft: 4 in. Over 75 ft: 6 in."},
{s:"L11",p:2,t:"mc",q:"Where do standpipes go?",o:["In every stair","In every corridor","Only in the fire pump room","In one stair per building"],e:"Put a standpipe in every stair. The guest slides agree: risers go within each required egress stair."},
{s:"L11",p:2,t:"mc",q:"What are the two water sources of a standpipe system?",o:["The water supply and the siamese (fire department connection)","The jockey pump and the fire pump","The domestic main and a roof tank","The test hydrant and the test header"],e:"Two sources: the water supply plus the siamese, which is the fire department connection fed by the pumper truck."},
{s:"L11",p:2,t:"mc",q:"What does the check valve at the siamese do?",o:["Keeps water from exiting at the siamese, like a one-way door","Prevents freezing","Reduces pressure to 85 psi","Detects flow and signals the alarm"],e:"Check valves prevent water from exiting at the siamese. Your margin note: like a door, one way."},
{s:"L11",p:2,t:"mc",q:"What is the auto ball drip for?",o:["It drains the line so it does not freeze","It maintains system pressure","It stops backflow into the city main","It signals a closed valve"],e:"Auto ball drip prevents freezing. Your note labels it as a drain."},
{s:"L11",p:2,t:"ms",c:3,q:"Which requirements apply to the siamese?",o:["Must be labeled","Must be visible","18 in. to 42 in. above grade","Located inside the stair enclosure","At least 6 ft above grade"],e:"Labeled, visible, and 18 in. to 42 in. above grade."},
{s:"L11",p:4,t:"mc",q:"What pressures does the standpipe riser diagram call for?",o:["100 psi at the top, reduced to 85 psi max at each floor","85 psi at the top, 100 psi max at each floor","65 psi at the top, 100 psi max at each floor","100 psi at every outlet"],e:"100 psi at the top. Pressure is reduced at each floor to 85 psi max."},
{s:"L11",p:3,t:"sa",q:"The stair sketch shows a hose cabinet recessed into the stair wall and flags a problem. What is the problem, and where does the 2½ in. valve go?",m:"Recessing the cabinet cuts into the rated stair wall, so the wall will not last its 2 hours at that spot. The 2½ in. valve comes off the riser at the intermediate stair landing, with the 1½ in. hose in the cabinet."},
{s:"JPA",t:"ms",c:6,q:"Where do the guest slides locate fire hose valves? Select all that apply.",o:["Stair landings (or intermediate landings, check with AHJ)","Horizontal exits","Exit passageways","Mall entrances","Stages","Roofs of high-rises, to serve adjacent buildings","Inside elevator cabs","Fire pump rooms"],e:"Stair landings, horizontal exits, exit passageways, mall entrances, stages, roofs for high-rise, and anywhere else needed to reach the building with a 200 ft hose."},
{s:"JPA",t:"num",a:200,tol:0,u:"ft",q:"Hose valves are placed so the whole building can be reached with a hose of what length?",e:"As required so you can reach the building with a 200 ft hose."},
{s:"JPA",t:"mc",q:"Which building type do the guest slides pair with a manual, dry standpipe?",o:["Parking garages","High-rises","Low-rise and mid-rise buildings","Malls"],e:"Manual and dry: often parking garages. Manual and wet: low-rise and mid-rise where standpipes are still required. Automatic: high-rise."},
{s:"JPA",t:"mc",q:"How many fire department connections does a high-rise standpipe system need?",o:["Two","One","Four","One per stair"],e:"Two fire department connections for high-rise buildings."},
{s:"JPA",t:"mc",q:"What pressure is needed at the most remote standpipe outlet?",o:["100 psi, although the AHJ can change it and some fire departments prefer 65 psi","65 psi in every case","85 psi maximum","140% of design pressure"],e:"100 psi at the most remote outlet, subject to modification by the AHJ. Sometimes 65 psi is required depending on fire department preferences."},
{s:"JPA",t:"tf",a:true,q:"A standpipe riser often doubles as a fire main that feeds sprinkler zone valve assemblies.",e:"True. Standpipes often double as a fire main and support sprinkler zone valve assemblies."}
]},
{id:"supply",name:"Water supply, flow test, fire pumps",blurb:"Hydrant flow tests, required pressure, pump sizing and what the pump room needs.",qs:[
{s:"L11",p:5,t:"mc",q:"In a hydrant flow test, where is static pressure read?",o:["At hydrant 1 with hydrant 2 closed","At hydrant 2 with hydrant 1 closed","At hydrant 2 while it is flowing","At the fire pump discharge"],e:"Static pressure is read at hydrant 1, with hydrant 2 closed."},
{s:"L11",p:5,t:"mc",q:"How is the residual reading taken?",o:["Read pressure at hydrant 1 while hydrant 2 flows, and convert the velocity pressure at 2 to GPM","Read pressure at hydrant 2 with both hydrants closed","Read velocity pressure at hydrant 1 and static pressure at hydrant 2","Close both hydrants and read the main"],e:"Residual pressure is in psi at a stated GPM: read pressure at 1, measure velocity pressure at 2 and convert it to GPM. Your note: velocity pressure is a surrogate for GPM."},
{s:"L11",p:5,t:"num",a:2,tol:0,u:"standpipes",q:"The worked example uses a required flow of 750 GPM. How many standpipes does that represent?",e:"500 GPM for the first plus 250 GPM for the second gives 750 GPM for 2 standpipes."},
{s:"L11",p:6,t:"ms",c:4,q:"Total required pressure is the sum of which four items?",o:["100 psi at the top","Static head (building height × 0.433 psi/ft)","Pipe loss","Equipment loss","Velocity pressure at the hydrant","Churn pressure"],e:"100 psi at top, head, pipe loss and equipment loss."},
{s:"L11",p:6,t:"num",a:0.433,tol:0.005,u:"psi/ft",q:"How much pressure does each foot of building height cost?",e:"Head = building height (ft) × 0.433 psi/ft."},
{s:"L11",p:6,t:"num",a:158,tol:0,u:"psi",q:"Worked example: 100 psi at the top, 38 psi of head, 10 psi pipe loss, 10 psi equipment loss. What is the total required pressure?",e:"100 + 38 + 10 + 10 = 158 psi. The 38 psi of head corresponds to a building about 88 ft tall."},
{s:"L11",p:6,t:"mc",q:"When does the system need a fire pump?",o:["When total required pressure is greater than available pressure","When available pressure is greater than required pressure","Whenever the building has sprinklers","Only when the building is taller than 75 ft"],e:"If required exceeds available, you need a pump. If required is less than available, no pump. In the example 158 psi is greater than 25 psi."},
{s:"L11",p:6,t:"num",a:133,tol:0,u:"psi",q:"The lecture's pump calculation takes 158 psi required and 25 psi available at the required flow. What pressure must the fire pump add?",e:"Fire pump pressure = required − available = 158 − 25 = 133 psi."},
{s:"L11",p:6,t:"mc",q:"Which formula gives fire pump brake horsepower?",o:["BHP = (Q × P) / (1710 × E)","BHP = (Q × P × E) / 1710","BHP = (Q × 1710) / (P × E)","BHP = (Q × 0.433) / (1710 × E)"],e:"BHP = Q × P / (1710 × E), with Q in GPM, P in psi and E the efficiency, 50 to 75%."},
{s:"L11",p:6,t:"num",a:77.8,tol:0.5,u:"BHP",q:"Find the brake horsepower for 750 GPM at 133 psi with 75% efficiency.",e:"750 × 133 / (1710 × 0.75) = 99,750 / 1,282.5 = 77.8 BHP."},
{s:"L11",p:6,t:"mc",q:"Which standard motor size fits a 77.8 BHP pump?",o:["100 HP","75 HP","60 HP","125 HP"],e:"75 HP falls short, so the slide goes to 100 HP, the next bigger size."},
{s:"L11",p:6,t:"sa",q:"Fire pump efficiency is only 50 to 75%. What does your margin note say about why that is accepted?",m:"The lighter the pump, the more efficient it is, so a less efficient pump is the heavier and more reliable one. A fire pump runs rarely and has to work when called."},
{s:"L11",p:4,t:"mc",q:"Starting at the street main, which order matches the riser diagram?",o:["Street main → post indicator valve → backflow preventer → fire pump with jockey pump in parallel → check valve → risers","Street main → fire pump → backflow preventer → post indicator valve → risers","Street main → check valve → jockey pump → post indicator valve → risers","Street main → siamese → fire pump → backflow preventer → risers"],e:"Water enters through the post indicator valve, then the backflow preventer (double-check valve), then the fire pump with the jockey pump piped around it, then a check valve to the risers. The siamese ties in downstream through its own check valve."},
{s:"JPA",t:"mc",q:"What does the jockey pump do?",o:["Runs periodically to maintain system pressure","Does the main job when flow is needed","Drains the test header","Boosts the fire department connection"],e:"The jockey pump runs periodically and maintains system pressure. The fire pump does the main job when flow is needed. Your 11.1a sketch notes it guarantees pressure."},
{s:"JPA",t:"mc",q:"What drives a fire pump?",o:["Diesel, or electric with a generator, and almost always electric","Always a diesel engine","Electric only, with no backup power","Steam turbine"],e:"Diesel or electric with generator, almost always electric. Lecture 11.1a lists a diesel engine. The guest slides are the ones to follow."},
{s:"JPA",t:"num",a:140,tol:0,u:"% of design pressure",q:"At churn (0% flow), what is the maximum pressure a fire pump may produce?",e:"0% flow and a maximum of 140% of design pressure. That point is called churn."},
{s:"JPA",t:"num",a:65,tol:0,u:"% of design pressure",q:"At 150% of design flow, a fire pump must still deliver what share of design pressure?",e:"150% flow at 65% of design pressure. The third point is 100% flow at design pressure."},
{s:"JPA",t:"ms",c:5,q:"What do the slides call for in and around the fire pump room? Select all that apply.",o:["Dedicated cooling on emergency power","An easily accessible room","A floor drain for the case temperature relief valve","A test header for annual testing","Power that is often dedicated and kept out of the building","A return-air plenum connection","A Class II hose rack"],e:"Controller, dedicated power that often does not run through the building, dedicated cooling with emergency power, an easily accessible room, a floor drain, and a test header for annual testing."},
{s:"JPA",t:"mc",q:"A sprinkler system is often fed from municipal potable water. What does that require?",o:["Backflow prevention","A deluge valve","A pressure-reducing valve","A draft tank"],e:"Backflow prevention for municipal potable water, sometimes with a test header."},
{s:"JPA",t:"mc",q:"What is the fire department connection for?",o:["It is a second water source once the fire department arrives","It is the primary water source","It drains the sprinkler zone","It tests the flow switch"],e:"The FDC is the second water source once the fire department arrives."},
{s:"JPA",t:"mc",q:"How long must the water supply last for each hazard class?",o:["Light 30 min, ordinary 60 to 90 min, extra 90 to 120 min","Light 60 min, ordinary 90 min, extra 180 min","Light 15 min, ordinary 30 min, extra 60 min","120 min for every hazard"],e:"LH 30 minutes, OH 60 to 90 minutes, EH 90 to 120 minutes."},
{s:"JPA",t:"mc",q:"Which standard covers water tanks for private fire protection?",o:["NFPA 22","NFPA 24","NFPA 13","NFPA 14"],e:"NFPA 22 covers water tanks. NFPA 24 covers private fire service mains and their appurtenances. NFPA 1 is the Fire Code."},
{s:"JPA",t:"mc",q:"NFPA 24 covers:",o:["Installation of private fire service mains and their appurtenances","Water tanks for private fire protection","Installation of standpipes","Sprinkler system design"],e:"NFPA 24: Standard for the Installation of Private Fire Service Mains and Their Appurtenances."},
{s:"JPA",t:"num",a:400,tol:0,u:"ft",q:"With a municipal main as the source, a hydrant must be within how many feet (subject to the AHJ)?",e:"Within 400 ft, but check with the AHJ. Place it where the truck will be and where the FDC is."},
{s:"JPA",t:"ms",c:3,q:"Which possible water sources do the slides list?",o:["Municipal utility water main","Draft tank","Hydropneumatic tank","Domestic water heater","Cooling tower basin"],e:"Municipal main (basically unlimited flow), draft tank, or hydropneumatic tank. Each must meet flow and pressure requirements."},
{s:"JPA",t:"mc",q:"What hose stream allowance is added for fire department use?",o:["250 GPM for ordinary hazard, 500 GPM for extra hazard","500 GPM for ordinary hazard, 250 GPM for extra hazard","100 GPM for ordinary hazard, 250 GPM for extra hazard","250 GPM for every hazard"],e:"OH 250 GPM and EH 500 GPM. The hose stream flow rate accounts for fire department use."},
{s:"JPA",t:"ms",c:2,q:"Which two conditions each add 30% to the sprinkler flow rate?",o:["A dry pipe system","A ceiling sloped more than 4:12","Quick-response heads","Pendent heads","A wet pipe system"],e:"Flow modifiers: dry pipe 30%, and sloped ceilings greater than 4:12 pitch 30%."},
{s:"JPA",t:"ms",c:5,q:"Which items make up the system pressure requirement on the slides?",o:["Backflow prevention and pipe fittings","Pipe friction","Elevation change","Sprinkler pressure drop, based on K-factor","Safety margin required by the jurisdiction","Churn pressure"],e:"Backflow prevention and fittings, pipe friction, elevation change (it is an open system), sprinkler pressure drop from the K-factor, and the safety margin the jurisdiction requires."}
]},
{id:"sprinklers",name:"Sprinkler components, heads, system types",blurb:"Valves and switches, piping, head anatomy, and wet, dry, pre-action and deluge systems.",qs:[
{s:"L11",p:7,t:"num",a:12,tol:0,u:"in.",q:"By definition, sprinkler piping is horizontal piping located within how many inches of the ceiling?",e:"Horizontal piping located 12 in. or less from the ceiling, serving heads that emit a fine water spray when high temperatures are detected."},
{s:"L11",p:7,t:"ms",c:2,q:"What are the two objectives of a sprinkler system?",o:["Control fires","Notify the fire department and occupants","Pressurize the exit stairs","Replace the standpipes"],e:"Control fires, and notify the fire department and occupants."},
{s:"L11",p:7,t:"mc",q:"Which document is the sprinkler design standard?",o:["NFPA 13","NFPA 14","NFPA 22","NFPA 1"],e:"IBC says where sprinklers are required. NFPA 13 is the design standard."},
{s:"L11",p:10,t:"mc",q:"What does OS&Y stand for in the notes?",o:["Open stem and yoke","Outside supply and yard","Operating shaft and yield","Open service and yoke"],e:"The notes call the shut-off valve OS&Y, open stem and yoke. The exposed stem shows at a glance whether the valve is open. You will also see it written outside screw and yoke."},
{s:"L11",p:10,t:"mc",q:"What does the tamper switch do?",o:["Monitors that the OS&Y valve stays open and reports to the fire alarm system","Detects water flow in the zone","Prevents backflow to the city main","Opens the pre-action valve"],e:"Tamper switch: keep the OS&Y valve open. It is connected to the fire alarm system."},
{s:"L11",p:10,t:"mc",q:"What does the flow switch do?",o:["Detects flow and reports it to the fire alarm system","Holds the valve open","Maintains system pressure","Shuts off the water when the temperature drops"],e:"Flow switch: detects flow. It is connected to the fire alarm system."},
{s:"L11",p:10,t:"num",a:12,tol:0,u:"heads",q:"The branch on each floor ties in to the fire alarm (FA). That is required of a system with more than how many heads?",e:"FA required of a system with more than 12 heads. The flow switch and the tamper switch on the branch both connect to the fire alarm system."},
{s:"L11",p:10,t:"mc",q:"The backflow preventer shown in the notes is what type?",o:["Double-check valve","Single swing check","Pressure-reducing valve","Deluge valve"],e:"System components: water supply, post indicator valve, and backflow preventer (double-check valve)."},
{s:"JPA",t:"ms",c:5,q:"What does a zone valve assembly do? Select all that apply.",o:["Receives water from the fire main","Distributes water to branch piping and sprinklers","Detects flow and ties in with the fire alarm system","Serves as the drain point for the zone","Serves as the test point for flow detection","Boosts pressure for upper floors"],e:"It receives water from the fire main, distributes it to the branches, detects flow, and serves as the drain and test location for the zone."},
{s:"JPA",t:"tf",a:false,q:"Sprinkler heads may be fed directly from the fire main.",e:"False. Fire mains carry water from the service entrance to the zone valve assemblies, and no sprinklers are fed directly from them. They may also serve as standpipes."},
{s:"L11",p:12,t:"mc",q:"In what order does water pass through the sprinkler piping network?",o:["Supply main → cross main → branch piping","Cross main → supply main → branch piping","Branch piping → cross main → supply main","Supply main → branch piping → cross main"],e:"Supply main, cross main, then branch piping."},
{s:"L11",p:12,t:"num",a:8,tol:0,u:"heads",q:"What is the maximum number of heads on a branch line?",e:"Branch piping: 8 heads max. Lecture 12.1 says the same thing as 8 sprinklers allowed on either side of the cross main."},
{s:"L11",p:12,t:"ms",c:4,q:"Which pipe materials and fittings do the notes list for sprinkler piping?",o:["Black iron","Copper","Screw fittings","Mechanical fittings","Cast-iron hub and spigot","Galvanized sheet-metal duct"],e:"Black iron and copper pipe, with screw fittings and mechanical fittings."},
{s:"JPA",t:"mc",q:"What temperature rating is typical for sprinkler heads?",o:["135°F to 155°F","70°F to 100°F","212°F to 250°F","500°F to 1,200°F"],e:"Typical use is 135 to 155°F, with higher ratings for hot locations. Lecture 11.1a gives an operating range of 135 to 170°F. The guest slides are the ones to follow."},
{s:"JPA",t:"ms",c:4,q:"Where do the slides call for heads with higher temperature ratings?",o:["Attics","Kitchens","Skylights","Boiler rooms","Open offices","Corridors"],e:"Higher temperatures for attics, kitchens, skylights, boiler rooms and similar spaces."},
{s:"L11",p:12,t:"tf",a:false,q:"In a wet pipe system, when one head activates every head in the zone discharges.",e:"False. Heads are typically activated individually by their own fusible link. The guest slide title says it: not like on TV."},
{s:"L11",p:12,t:"mc",q:"Once a head opens, water runs until:",o:["Someone shuts it off","The fusible link resets","The room drops below 135°F","The jockey pump stops"],e:"Water runs until it is shut off. Heads are one-time use and must be replaced."},
{s:"L11",p:12,t:"ms",c:3,q:"Which three parts are labeled on the sprinkler head sketch?",o:["Deflector","Fusible link","Nozzle","Yoke","Tamper switch"],e:"Deflector, fusible link and nozzle."},
{s:"L11",p:12,t:"mc",q:"Which of these is not a sprinkler head type listed in the notes?",o:["Siamese","Upright","Pendent","Sidewall"],e:"The types are upright, pendent, sidewall, flow control, concealed and semi-concealed. A siamese is the fire department connection."},
{s:"L11",p:12,t:"mc",q:"What is special about a flow-control head?",o:["It closes automatically when the temperature decreases, although it has failed occasionally","It opens every head on the branch at once","It limits discharge to 5.6 GPM","It sits behind a cover plate"],e:"Flow control: closes automatically when temperature decreases. Failed occasionally."},
{s:"L11",p:12,t:"mc",q:"In Q = K√P, what does each term stand for?",o:["Q is flow in GPM, P is pressure in psi, K depends on the orifice size","Q is pressure in psi, P is power, K is 1710","Q is flow in GPM, P is pipe diameter, K is a friction coefficient","Q is heat in BTU, P is pressure, K is conductivity"],e:"Q in GPM, P in psi, and K a factor based on the size of the orifice, typically ½ in."},
{s:"JPA",t:"mc",q:"What K-factors do the guest slides give?",o:["5.6 is typical, 8.0 for some ordinary or extra hazard","8.0 is typical, 5.6 for extra hazard","1.85 is typical, 4.87 for extra hazard","0.433 for every head"],e:"K = 5.6 is typical. K = 8.0 serves some OH or EH with more flow per head, and higher values are available."},
{s:"JPA",t:"mc",q:"What are the two response categories for heads?",o:["Standard and quick","Wet and dry","Upright and pendent","Single and double interlock"],e:"Response: standard or quick."},
{s:"L11",p:13,t:"ms",c:4,q:"Which statements describe a wet pipe system?",o:["Piping is always filled with water","It is the most common type","It can freeze","Discharge is immediate and the system is simple","It needs quick-opening devices","Its heads are always open"],e:"Wet pipe: always filled with water, most common, freezing potential, immediate discharge and simple."},
{s:"L11",p:13,t:"ms",c:4,q:"Which statements describe a dry pipe system?",o:["Piping is filled with compressed air","Quick-opening devices are required","Piping must be pitched to drain","It is used in unheated spaces","It is the most common type","Its heads are always open"],e:"Dry pipe: compressed air in the pipe, a releasing head lets the air escape, water fills the pipe, quick-opening devices required, piping pitched to drain, used in unheated space."},
{s:"JPA",t:"mc",q:"Where does the gas in a dry pipe system come from?",o:["An air compressor, nitrogen or another source","Halon 1301 cylinders","Steam from the boiler","CO₂ extinguishers"],e:"Pipes are full of gas under pressure, from an air compressor, nitrogen, or another source."},
{s:"L11",p:13,t:"mc",q:"Which sequence describes a pre-action system in Lecture 11.1a?",o:["A smoke detector opens the pre-action valve, the pipes fill and the alarm sounds, then water leaves only through heads whose fusible link has released","A head opens, air escapes, then water fills the pipe","A detection system opens the valve and every head discharges","Water is always in the pipe and flows when a head opens"],e:"Pre-action piping holds compressed air. A smoke detector activates the pre-action valve to fill the system and sound the alarm. Individual heads discharge when their fusible link releases."},
{s:"L12",p:1,t:"mc",q:"The Lecture 12.1 note on pre-action says water discharges only when:",o:["The smoke detector trips and the glass part of the head breaks","The smoke detector trips, with nothing else needed","A head breaks, with nothing else needed","Someone pulls a manual station"],e:"For pre-action you need the smoke detector and the glass part to break."},
{s:"L11",p:13,t:"ms",c:2,q:"Where do the notes say to use pre-action?",o:["Computer facilities","Libraries","Unheated loading docks","Atrium water curtains"],e:"Use where accidental discharge may be costly: computer facilities, libraries and the like."},
{s:"JPA",t:"mc",q:"In a double-interlock pre-action system, water enters the piping when:",o:["An alarm event and a head activation both occur","An alarm event occurs alone","A head activates alone","The jockey pump starts"],e:"Two events must occur: an alarm event and head activation, which releases the air pressure. Use it where an accidental system fill is catastrophic."},
{s:"JPA",t:"mc",q:"When is single-interlock pre-action the right choice?",o:["Where speed matters more and an accidental fill is not catastrophic","Where an accidental fill is catastrophic","Only in unheated spaces","Where every head must discharge at once"],e:"Single interlock: an alarm event fills the piping, and water flows once a head activates. Use where speed is more important and accidental system fill is not catastrophic."},
{s:"L11",p:13,t:"ms",c:4,q:"Which statements describe a deluge system?",o:["Sprinkler heads are open","Piping is open to air","An area fire detection system activates the deluge valve","Water discharges from every head at 100% flow","Heads open one at a time by fusible link","Piping holds compressed air"],e:"Deluge: open heads, piping open to air, an area detection system opens the deluge valve, and every head discharges."},
{s:"L11",p:13,t:"mc",q:"Where is a deluge system used?",o:["Where rapid fire spread is possible, and to make a water curtain at atriums","Computer rooms","Unheated attics","Typical offices"],e:"Used where rapid spread of fire is possible, and to create a water curtain at atriums."},
{s:"L11",p:13,t:"mc",q:"An unheated loading dock needs sprinklers. Which system type fits?",o:["Dry pipe","Wet pipe","Deluge","Single-interlock pre-action"],e:"Dry pipe is used in unheated space because a wet system has freezing potential. The West 1 single-line diagram shows a 4 in. dry sprinkler valve serving the loading dock."},
{s:"JPA",t:"mc",q:"A rare-book archive cannot tolerate water in the piping unless there is a real fire. Which system type fits best?",o:["Double-interlock pre-action","Wet pipe","Deluge","Dry pipe"],e:"Double interlock is for places where an accidental system fill is catastrophic."},
{s:"L11",p:14,t:"ms",c:3,q:"Which three ways of protecting an atrium do the notes list?",o:["Deluge sprinklers","Glass with sprinklers at 6 ft on center on the side with a walking surface","Rolling fire shutters","Class II hose racks","Halon flooding"],e:"Deluge sprinklers, glass with sprinklers at 6 ft on center on the side with a walking surface, or rolling fire shutters."},
{s:"JPA",t:"mc",q:"How do the slides describe the fire department connection?",o:["Wall-mounted or site-mounted, with the number of connections set by the required flow","Always wall-mounted with exactly two inlets","Located inside the fire pump room","Located on the roof"],e:"Wall-mounted or site-mounted, with a different number of connections for different required flow rates."}
]},
{id:"design",name:"Hazard classes, placement, pipe sizing, hydraulics",blurb:"Occupancy classification, head spacing, the pipe schedule method and density/area design.",qs:[
{s:"L12",p:1,t:"mc",q:"What does class of occupancy relate to?",o:["Sprinkler systems and their water supply","Egress width","Structural fire rating","Standpipe class"],e:"Class of occupancy relates to sprinkler systems and their water supply."},
{s:"L12",p:1,t:"ms",c:3,q:"Which are light hazard occupancies?",o:["Churches","Schools","Offices","Laundries","Library stacks","Repair garages"],e:"Light hazard means quantity and combustibility of contents are low: churches, schools, offices."},
{s:"L12",p:1,t:"mc",q:"How is an automobile parking garage classified?",o:["Ordinary hazard, Group I","Light hazard","Ordinary hazard, Group III","Extra hazard, Group I"],e:"Ordinary hazard Group I: automobile parking garages, electronic plants, laundries, restaurant service areas."},
{s:"L12",p:1,t:"mc",q:"How are library stacks classified?",o:["Ordinary hazard, Group II","Light hazard","Ordinary hazard, Group I","Extra hazard, Group II"],e:"Ordinary hazard Group II: chemical plant, machine shop, printing and publishing, library stacks."},
{s:"L12",p:1,t:"mc",q:"Paper and pulp mills and repair garages fall in which class?",o:["Ordinary hazard, Group III","Ordinary hazard, Group I","Extra hazard, Group I","Light hazard"],e:"Ordinary hazard Group III: paper and pulp mill, repair garages."},
{s:"L12",p:1,t:"mc",q:"Die casting and metal extruding fall in which class?",o:["Extra hazard, Group I","Extra hazard, Group II","Ordinary hazard, Group II","Ordinary hazard, Group III"],e:"Extra hazard Group I: die casting, metal extruding."},
{s:"L12",p:1,t:"ms",c:4,q:"Which occupancies are extra hazard, Group II?",o:["Asphalt saturating","Flammable liquid spraying","Solvent cleaning","Mobile or modular home manufacturing","Laundries","Machine shop"],e:"Extra hazard Group II: asphalt saturating, flammable liquid spraying, solvent cleaning, mobile or modular home manufacturing."},
{s:"L12",p:1,t:"ms",c:4,q:"Which occupancies are ordinary hazard, Group I?",o:["Automobile parking garages","Electronic plant","Laundries","Restaurant service areas","Chemical plant","Printing and publishing"],e:"Group I: parking garages, electronic plant, laundries, restaurant service areas. Chemical plant and printing are Group II."},
{s:"JPA",t:"mc",q:"On the guest slides, wood machining and textile manufacturing are examples of:",o:["Extra hazard, Group 1","Ordinary hazard, Group 2","Extra hazard, Group 2","Light hazard"],e:"Extra hazard Group 1: wood machining, textile manufacturing. Group 2: solvents. The slides also put offices in light hazard, parking garages and restaurants in OH Group 1, and libraries and chem labs in OH Group 2."},
{s:"L12",p:2,t:"mc",q:"What is the coverage per head for light hazard with a smooth ceiling, hydraulically calculated?",o:["225 ft², heads 15 ft on center","130 ft², heads 11.4 ft on center","100 ft², heads 10 ft on center","90 ft²"],e:"Light hazard: 15 ft on center, A = 225 ft². The note adds that the head sprays a 17.5 ft circle to cover the full square."},
{s:"L12",p:2,t:"num",a:130,tol:0,u:"ft²",q:"What is the coverage per head for ordinary hazard?",e:"130 ft², which is 11.4 ft × 11.4 ft."},
{s:"L12",p:2,t:"num",a:100,tol:0,u:"ft²",q:"What is the coverage per head for high-pile storage?",e:"100 ft², a 10 ft × 10 ft grid."},
{s:"L12",p:2,t:"num",a:90,tol:0,u:"ft²",q:"What is the coverage per head for extra hazard?",e:"90 ft²."},
{s:"L12",t:"mc",q:"The slides cite the 1953 Hydramatic fire in Livonia, Michigan. What was it?",o:["The biggest industrial fire in history, a $50 million loss","A high-rise fire that led to stair pressurization","A nightclub fire caused by pyrotechnics","A hotel fire spread by air handling equipment"],e:"1953 Hydramatic fire, Livonia, Michigan: biggest industrial fire in history, $50 million loss."},
{s:"L12",p:2,t:"mc",q:"Why can't sprinkler heads be placed too close together?",o:["Spray from one head can cool a neighboring head so it does not go off","Pipe friction becomes too high","The deflectors collide","It breaks the pipe schedule"],e:"They cannot be too close because one can cool off another head, causing it not to go off."},
{s:"L12",p:7,t:"num",a:7.5,tol:0,u:"ft",q:"With heads at 15 ft on center, what is the farthest a head can be from a wall?",e:"7 ft 6 in., half the head spacing. The layout sketch is dimensioned 15 ft 0 in. max and 7 ft 6 in. max."},
{s:"L12",p:7,t:"num",a:6,tol:0,u:"ft",q:"The layout sketch dimensions head spacing as 15 ft max and how many feet minimum?",e:"15 ft max and 6 ft min."},
{s:"L12",p:5,t:"num",a:30,tol:0,u:"heads",q:"301 Engineering A is light hazard with an area of 6,700 ft². What is the minimum number of heads at 225 ft² each?",e:"6,700 / 225 = 29.8, so at least 30 heads. The actual layout can need more to keep every head within 7 ft 6 in. of a wall."},
{s:"L12",p:5,t:"ms",c:4,q:"Which assumptions go with the pipe schedule example in the notes?",o:["Light hazard","½ in. orifice","8 sprinklers allowed on either side of the cross main","Steel pipe","Extra hazard","Copper tube"],e:"Light hazard, ½ in. orifice, 8 sprinklers on either side of the cross main, steel pipe, 6,700 ft²."},
{s:"L12",t:"tf",a:false,q:"The pipe schedule sizing tables are still the accepted way to size sprinkler piping.",e:"False. The slide is stamped: pipe sizing tables obsolete, hydraulic calculations required. Learn the table for class and expect hydraulic calculations in practice."},
{s:"L12",p:5,t:"num",a:2,tol:0,u:"sprinklers",q:"By the pipe schedule, how many sprinklers can a 1 in. pipe feed?",e:"1 in.: 2 sprinklers. 1¼ in.: 3. 1½ in.: 5. 2 in.: 10. 2½ in.: 30. 3 in.: 60. 3½ in.: 100."},
{s:"L12",p:5,t:"mc",q:"What is the smallest pipe that can feed 4 sprinklers?",o:["1½ in.","1 in.","1¼ in.","2 in."],e:"1¼ in. stops at 3 sprinklers, so 4 sprinklers need 1½ in., which handles up to 5."},
{s:"L12",p:5,t:"mc",q:"What is the smallest pipe that can feed 25 sprinklers?",o:["2½ in.","2 in.","3 in.","1½ in."],e:"2 in. stops at 10 sprinklers. 2½ in. handles up to 30."},
{s:"L12",p:5,t:"mc",q:"A cross main segment carries 45 sprinklers. What size is it?",o:["3 in.","2½ in.","3½ in.","4 in."],e:"2½ in. stops at 30. 3 in. handles up to 60."},
{s:"L12",p:7,t:"mc",q:"A branch line feeds 5 heads. By the pipe schedule, what size is the segment at the cross main, and what size is the segment feeding only the last 2 heads?",o:["1½ in. at the cross main, 1 in. at the end","2 in. at the cross main, 1¼ in. at the end","1 in. for the whole branch","1¼ in. at the cross main, 1 in. at the end"],e:"Size each segment by the heads downstream of it: 5 heads need 1½ in., 2 heads need 1 in. The layout in your notes labels a branch 1 in., 1 in., 1¼ in., 1½ in. working back toward the main."},
{s:"L12",p:3,t:"mc",q:"Per the sidewall table, what is the maximum distance between sidewall sprinklers on a branch line?",o:["14 ft for light hazard, 10 ft for ordinary hazard","10 ft for light hazard, 14 ft for ordinary hazard","15 ft for both","6 ft for both"],e:"Light hazard 14 ft, ordinary hazard 10 ft."},
{s:"L12",p:4,t:"num",a:18,tol:0,u:"in.",q:"What is the minimum clearance between the sprinkler deflector and the top of storage?",e:"Not less than 18 in. (457 mm) above the top of storage."},
{s:"L12",p:9,t:"mc",q:"What is the minimum design point for light hazard on the density/area curves?",o:["1,500 ft² at 0.10 GPM/ft², 150 GPM","3,000 ft² at 0.10 GPM/ft², 300 GPM","1,500 ft² at 0.15 GPM/ft², 225 GPM","2,500 ft² at 0.40 GPM/ft², 1,000 GPM"],e:"Light (min): 1,500 ft² at 0.10 gives 150 GPM. Light (max): 3,000 ft² at 0.07 gives 210 GPM."},
{s:"L12",p:9,t:"num",a:225,tol:0,u:"GPM",q:"Ordinary hazard Group 1, minimum point: 1,500 ft² at 0.15 GPM/ft². What is the sprinkler flow?",e:"1,500 × 0.15 = 225 GPM."},
{s:"L12",p:9,t:"num",a:400,tol:0,u:"GPM",q:"Ordinary hazard Group 1, maximum point: 4,000 ft² at 0.10 GPM/ft². What is the sprinkler flow?",e:"4,000 × 0.10 = 400 GPM."},
{s:"L12",p:9,t:"num",a:1500,tol:0,u:"GPM",q:"Extra hazard Group 2, maximum point: 5,000 ft² at 0.30 GPM/ft². What is the sprinkler flow?",e:"5,000 × 0.30 = 1,500 GPM. The minimum point is 2,500 ft² at 0.40, giving 1,000 GPM."},
{s:"L12",p:9,t:"mc",q:"Moving along one hazard curve to a larger area of sprinkler operation does what to the required density?",o:["Lowers it","Raises it","Leaves it the same","Doubles it"],e:"Density drops as area grows: light hazard is 0.10 at 1,500 ft² and 0.07 at 3,000 ft². Total flow still rises, from 150 to 210 GPM."},
{s:"L12",p:9,t:"mc",q:"Who decides which point on the density/area curve is used?",o:["The insurance carrier or the owner","The sprinkler head manufacturer","The fire pump vendor","The mechanical contractor"],e:"Your note: this is based on the insurance or owner's decision."},
{s:"L12",p:9,t:"mc",q:"What does the GPM figure at the end of the density/area table represent?",o:["The flow the entire system has to supply","The flow from one head","The hose stream allowance","The jockey pump flow"],e:"The end number is what the entire system has to supply. Your note compares 150 GPM to 15 showers."},
{s:"L12",p:10,t:"mc",q:"Who provides the hydraulic calculations?",o:["The sprinkler contractor, as part of shop drawings","The architect, during design development","The AHJ","The fire pump manufacturer"],e:"Hydraulic calculations are provided by the sprinkler contractor as part of shop drawings."},
{s:"L12",p:10,t:"mc",q:"Which formula gives pipe friction loss in hydraulic calculations?",o:["Hazen-Williams: p = 4.52 Q^1.85 / (C^1.85 d^4.87)","Q = K√P","Pv = 0.001123 Q² / D⁴","BHP = Q × P / (1710 × E)"],e:"Hazen-Williams, where p is psi per foot of pipe, Q is GPM, d is the actual internal diameter in inches and C is the friction loss coefficient."},
{s:"L12",p:10,t:"mc",q:"In the Hazen-Williams formula, what does a larger pipe diameter do to friction loss?",o:["Cuts it sharply, because d is raised to the 4.87 power in the denominator","Raises it in direct proportion","Cuts it in direct proportion","Has no effect"],e:"Loss varies with 1 / d^4.87, so a small increase in diameter removes a lot of friction."},
