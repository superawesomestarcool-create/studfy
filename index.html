{s:"L12",p:10,t:"mc",q:"How is normal pressure found?",o:["Pn = Pt − Pv, total pressure minus velocity pressure","Pn = Pt + Pv","Pn = Pv − Pt","Pn = K√P"],e:"Normal pressure Pn = Pt − Pv. Velocity pressure is Pv = 0.001123 Q² / D⁴."},
{s:"L12",p:10,t:"mc",q:"A hydraulically calculated system supersedes the pipe schedule rules, but pipe may be no smaller than:",o:["1 in. for ferrous pipe and ¾ in. for copper tube","½ in. for any material","2 in. for any material","1¼ in. for ferrous pipe and 1 in. for copper tube"],e:"The NFPA excerpt in your notes sets minimums of 1 in. nominal for ferrous piping and ¾ in. nominal for copper tubing."},
{s:"L12",p:8,t:"mc",q:"About how much do fire-rated ceiling tiles weigh?",o:["1 lb per square foot","¼ lb per square foot","5 lb per square foot","10 lb per square foot"],e:"The image caption notes fire-rated tiles are 1 lb/sq ft. The U.L. design shown beside it (G032) is a 2-hour assembly that names the acoustical tile as part of the rating."}
]},
{id:"egress",name:"Egress, atriums, fire command center",blurb:"How MEP systems meet corridors, stairs, passageways, atriums and the command center.",qs:[
{s:"JPA",t:"mc",q:"Who designs occupant egress?",o:["The architect, with life safety code consultants","The MEP engineer","The sprinkler contractor","The fire department"],e:"Designed by the architect with life safety code consultants. The slides call it an entire profession."},
{s:"JPA",t:"ms",c:4,q:"Which statements describe an exit access corridor?",o:["Sometimes fire rated, depending on occupancy and whether the building is sprinklered","Leads to an exit","Usually has door closers","No storage","May be used as a return-air plenum","Always 2-hour rated"],e:"Sometimes fire rated, leads to an exit, usually has door closers, no storage."},
{s:"JPA",t:"tf",a:false,q:"An exit access corridor may be used as a plenum for return air.",e:"False. Corridors may not be used as plenums for return air movement."},
{s:"JPA",t:"mc",q:"When corridor walls are rated, what is needed at duct penetrations where systems have openings to the corridor?",o:["Smoke dampers","Flow switches","Beam detectors","Quick-opening devices"],e:"If corridor walls are rated, smoke dampers are needed at those duct penetrations."},
{s:"JPA",t:"mc",q:"How do the slides describe exit stairs?",o:["Fire-rated shafts that lead outside or to an exit passageway","Unrated shafts that lead to the atrium","Rated shafts that end at the fire command center","Corridors fitted with door closers"],e:"Fire-rated shafts that lead outside or to an exit passageway, with door closers, no storage, and standpipes when required."},
{s:"JPA",t:"mc",q:"What is an exit passageway?",o:["A fire-rated tunnel, like a stair but horizontal, that leads outside","A corridor used for return air","A lobby that opens to the atrium","A stair that serves only the roof"],e:"A fire-rated tunnel, just like a stair but horizontal. It leads outside."},
{s:"JPA",t:"mc",q:"Which building systems may pass through an exit stair or exit passageway?",o:["None. Everything that enters the stair serves the stair","Any system that is firestopped","Domestic water only","Return-air ducts only"],e:"No building systems or air pass through. Everything that goes into the stair serves the stair."},
{s:"JPA",t:"mc",q:"What HVAC feature do the stairs of a high-rise need?",o:["Stair pressurization","Atrium smoke exhaust","Return-air plenums","Dry pipe valves"],e:"For a high-rise, stair pressurization is needed, with controls that meet fire alarm system requirements."},
{s:"JPA",t:"ms",c:5,q:"Which statements about atrium HVAC come from the slides?",o:["Hard to condition because of stratification","Smoke exhaust may be needed, with lots of exhaust and makeup air","Exhaust and makeup air both have velocity limits","The smoke layer has to stay above egress for a design fire","CFD modeling is often needed","Sprinklers are waived in tall spaces"],e:"Stratification, smoke exhaust with large exhaust and makeup air flows, velocity limitations (big air devices, open doors), a smoke layer held above egress based on a design fire, and CFD modeling."},
{s:"JPA",t:"tf",a:false,q:"Sprinklers may be less effective in tall atrium spaces, so they are not required there.",e:"False. Sprinklers may not be as effective in tall spaces, but they are still required."},
{s:"JPA",t:"mc",q:"Which detector type is often needed in an atrium?",o:["Beam detectors","Tamper switches","Flow switches","Fusible links"],e:"Fire alarm: beam detectors are often needed."},
{s:"JPA",t:"mc",q:"Which buildings need a fire command center?",o:["High-rise buildings","Every sprinklered building","Parking garages","Every building with a standpipe"],e:"A fire command center is needed for a high-rise building."},
{s:"JPA",t:"ms",c:6,q:"What does a fire command center contain? Select all that apply.",o:["Building plans","Fire alarm control panel","Voice evacuation communication","Fire department communication and a telephone","Status and control of AHUs and smoke control","Emergency power status","The fire pump test header","The jockey pump"],e:"Building plans, fire alarm control panel, voice evacuation, fire department communication, telephone, all major air-moving equipment, and emergency power status."},
{s:"JPA",t:"ms",c:3,q:"What does the fire command center room itself need?",o:["A protected entrance","Dedicated HVAC","Emergency power","A deluge system","A hose valve"],e:"A protected entrance, dedicated HVAC and emergency power."}
]},
{id:"calcs",name:"Calculation problems",blurb:"Fresh numbers, same methods. Work each one on paper first.",qs:[
{s:"JPA",t:"num",a:1000,tol:0,u:"GPM",q:"A building has 3 standpipe risers. What flow is required?",e:"500 GPM for the first riser plus 250 GPM for each of the other two = 1,000 GPM."},
{s:"JPA",t:"num",a:1250,tol:0,u:"GPM",q:"A non-sprinklered building has 4 standpipe risers. What flow is required?",e:"500 + 3 × 250 = 1,250 GPM, which is also the cap for a non-sprinklered building."},
{s:"JPA",t:"num",a:1000,tol:0,u:"GPM",q:"A sprinklered building has 5 standpipe risers. What flow is required?",e:"500 + 4 × 250 would be 1,500 GPM, but a sprinklered building is capped at 1,000 GPM."},
{s:"L11",p:6,t:"num",a:52,tol:0.5,u:"psi",q:"A building is 120 ft tall. What is the static head?",e:"120 ft × 0.433 psi/ft = 51.96, about 52 psi."},
{s:"L11",p:6,t:"num",a:172,tol:1,u:"psi",q:"That same 120 ft building has 12 psi of pipe loss and 8 psi of equipment loss. What is the total required pressure?",e:"100 at the top + 52 head + 12 pipe + 8 equipment = 172 psi."},
{s:"L11",p:6,t:"num",a:132,tol:1,u:"psi",q:"The flow test shows 40 psi available at the required flow. What pressure must the fire pump add to reach 172 psi?",e:"172 − 40 = 132 psi."},
{s:"L11",p:6,t:"num",a:118.8,tol:1,u:"BHP",q:"Find the brake horsepower for 1,000 GPM at 132 psi with 65% efficiency.",e:"1,000 × 132 / (1710 × 0.65) = 132,000 / 1,111.5 = 118.8 BHP."},
{s:"L11",p:6,t:"mc",q:"Which motor from the table in the notes fits 118.8 BHP?",o:["125 HP","100 HP","150 HP","75 HP"],e:"100 HP falls short. The next size on the table is 125 HP."},
{s:"JPA",t:"num",a:182,tol:0.5,u:"psi",q:"A fire pump is rated 750 GPM at 130 psi. What is the highest pressure it may produce at churn?",e:"140% of 130 psi = 182 psi."},
{s:"JPA",t:"num",a:84.5,tol:0.5,u:"psi",q:"The same pump (750 GPM at 130 psi) is run at 150% of rated flow, 1,125 GPM. What pressure must it still deliver?",e:"65% of 130 psi = 84.5 psi at 1,125 GPM."},
{s:"JPA",t:"num",a:28,tol:0.2,u:"GPM",q:"A head with K = 5.6 sees 25 psi. What is its flow?",e:"Q = K√P = 5.6 × √25 = 5.6 × 5 = 28 GPM."},
{s:"JPA",t:"num",a:32,tol:0.2,u:"GPM",q:"A head with K = 8.0 sees 16 psi. What is its flow?",e:"Q = 8.0 × √16 = 8.0 × 4 = 32 GPM."},
{s:"JPA",t:"num",a:28.7,tol:0.5,u:"psi",q:"What pressure does a K = 5.6 head need to deliver 30 GPM?",e:"P = (Q / K)² = (30 / 5.6)² = 5.357² = 28.7 psi."},
{s:"L12",p:2,t:"num",a:93,tol:0,u:"heads",q:"An ordinary hazard floor is 12,000 ft². What is the minimum number of heads?",e:"12,000 / 130 = 92.3, so round up to 93 heads."},
{s:"L12",p:2,t:"num",a:12,tol:0,u:"heads",q:"A light hazard room measures 45 ft × 60 ft. How many heads does it need at maximum spacing?",e:"2,700 / 225 = 12 heads. A 3 × 4 grid at 15 ft on center puts the outer rows 7 ft 6 in. from the walls, which is the limit."},
{s:"JPA",t:"num",a:475,tol:0,u:"GPM",q:"Ordinary hazard Group 1, designed at 0.15 GPM/ft² over 1,500 ft². Add the hose stream allowance. What total flow must the supply deliver?",e:"Sprinklers 1,500 × 0.15 = 225 GPM. Hose stream for ordinary hazard is 250 GPM. Total 475 GPM."},
{s:"JPA",t:"num",a:28500,tol:0,u:"gallons",q:"That 475 GPM demand must last 60 minutes, the low end for ordinary hazard. How much stored water is that?",e:"475 GPM × 60 min = 28,500 gallons. At the 90-minute end it would be 42,750 gallons."},
{s:"JPA",t:"num",a:292.5,tol:1,u:"GPM",q:"A 225 GPM sprinkler demand is served by a dry pipe system. Apply the modifier. What is the sprinkler flow now?",e:"Dry pipe adds 30%: 225 × 1.30 = 292.5 GPM."},
{s:"L12",p:10,t:"num",a:0.094,tol:0.005,u:"psi/ft",q:"Use Hazen-Williams for 100 GPM in pipe with a 2.067 in. internal diameter and C = 120. What is the friction loss per foot?",e:"p = 4.52 × 100^1.85 / (120^1.85 × 2.067^4.87) = 0.094 psi per foot, or about 9.4 psi per 100 ft."},
{s:"L12",p:10,t:"num",a:1.07,tol:0.05,u:"psi",q:"Find the velocity pressure for 500 GPM in pipe with a 4.026 in. internal diameter.",e:"Pv = 0.001123 Q² / D⁴ = 0.001123 × 250,000 / 262.7 = 1.07 psi."},
{s:"L10",t:"num",a:1120,tol:1,u:"BTU",q:"One pound of water at 62°F is heated to 212°F and then vaporized. How much heat does it absorb?",e:"Sensible: 1 Btu/°F·lb × (212 − 62) = 150 BTU. Latent: 970 BTU. Total 1,120 BTU."},
{s:"C10",t:"num",a:65000,tol:0,u:"ft²",q:"A building's tabular allowable area is 20,000 ft². The frontage increase is 25% and the sprinkler increase is 200%. What is the allowable area?",e:"Aa = A × (1 + If/100 + Is/100) = 20,000 × (1 + 0.25 + 2.00) = 65,000 ft²."},
{s:"C10",t:"num",a:3,tol:0,u:"areas of refuge",q:"A floor has 520 occupants. At one area of refuge for each 200 occupants, how many are needed?",e:"520 / 200 = 2.6, so 3 areas of refuge."},
{s:"C10",t:"num",a:28500,tol:0,u:"ft²",q:"The table allows 9,500 ft² per floor. The building is multi-story and fully sprinklered, with no frontage increase. What is the allowable area per floor?",e:"Sprinklers add 200%: 9,500 × 2 = 19,000 on top of the 9,500, for 28,500 ft²."},
{s:"C10",t:"num",a:50,tol:0,u:"%",q:"Three quarters of a building's perimeter fronts open space 30 ft wide. What frontage increase If does it earn?",e:"If = [F/P − 0.25] × W/30 = (0.75 − 0.25) × 30/30 = 0.50, a 50% increase."},
{s:"C10",t:"num",a:40,tol:0.5,u:"%",q:"Same building, but the open space is only 24 ft wide. What is the frontage increase now?",e:"(0.75 − 0.25) × 24/30 = 0.40, a 40% increase. Below 20 ft it would be zero."},
{s:"C10",t:"num",a:140,tol:0,u:"occupants",q:"A business floor has 14,000 ft² of gross area. What is its occupant load?",e:"14,000 / 100 ft² per occupant = 140 occupants."},
{s:"C10",t:"num",a:48,tol:0,u:"in.",q:"Those 140 occupants use one stair at 0.3 in. of width per occupant. What stair width must be provided?",e:"140 × 0.3 = 42 in. by calculation, but the minimum stair width is 48 in., so 48 in. governs."},
{s:"FA",t:"num",a:434,tol:0,u:"people",q:"From the egress practicum review: 225 people come down a stair and 209 come up it from the basement. Both streams meet at the first-floor landing. How many must that landing handle?",e:"225 + 209 = 434. First-floor occupants are left out, because they exit directly outside."}
]},
{id:"codes",name:"Codes and egress requirements",blurb:"Types of codes, IBC height and area, means of egress, signs, lighting, stairs and smoke-proof towers.",qs:[
{s:"C10",t:"ms",c:3,q:"How does the codes lecture describe building codes?",o:["They provide sound and progressive construction practices","They are minimum requirements","They don't cover everything","They describe the ideal building","They apply only to high-rises"],e:"Sound and progressive construction practices, minimum requirements, and codes don't cover everything."},
{s:"C10",t:"mc",q:"A project includes something the code does not cover. Who makes the interpretation?",o:["The AHJ, the authority having jurisdiction","The architect of record","The sprinkler contractor","The building owner"],e:"Codes are not written to cover every eventual problem. When they don't, the authority having jurisdiction (AHJ) makes the final call on whether the design meets the code's intent."},
{s:"C10",t:"ms",c:3,q:"What does a zoning code do?",o:["Regulates the type and size of buildings in a specific area of a municipality","Protects property value","Results from land use planning","Sets sprinkler densities","Rates fire-resistive assemblies"],e:"Zoning is a municipal code that regulates the type and size of buildings in an area, protects property value, and is the result of land use planning. Typical zones: commercial, industrial, residential."},
{s:"C10",t:"mc",q:"Which federal body sets minimal standards for hospitals and other medical facilities?",o:["Department of Health","OSHA","HUD","ICC"],e:"Department of Health: hospitals and medical facilities. OSHA: the workplace. HUD: farmer's home."},
{s:"C10",t:"ms",c:3,q:"Which were the former model codes?",o:["National Building Code","Uniform Building Code","Southern Standard Building Code","NFPA 13","Zoning ordinance"],e:"National Building Code, Uniform Building Code (International Conference of Building Officials) and Southern Standard Building Code. Model code organizations wrote them, municipalities adopted them, and they were updated every few years."},
{s:"C10",t:"mc",q:"Who publishes the International Building Code?",o:["ICC, the International Code Council","NFPA, the National Fire Protection Association","U.L., Underwriter Laboratory","OSHA"],e:"The International Building Code comes from the ICC, the International Code Council."},
{s:"C10",t:"tf",a:false,q:"A new edition of the IBC applies in Pennsylvania as soon as the ICC publishes it.",e:"False. Until a government adopts it by law, it is just a book somebody wrote. Pennsylvania adopted the IBC by law, and State College adopted it too so it can write local exceptions and clarifications."},
{s:"C10",t:"mc",q:"NFPA standards are described as what kind of codes?",o:["How-to codes","Zoning codes","Model codes","Federal regulations"],e:"Standards are how-to codes. NFPA 13 covers sprinklers, NFPA 14 standpipes and hose systems, NFPA 101 life safety."},
{s:"C10",t:"mc",q:"Which NFPA standard covers life safety?",o:["NFPA 101","NFPA 13","NFPA 14","NFPA 22"],e:"NFPA 101 is Life Safety. NFPA 13 is sprinklers and NFPA 14 is standpipes and hose systems."},
{s:"C10",t:"mc",q:"Which document is the National Electrical Code?",o:["NFPA 70","NFPA 13","NFPA 101","The IBC electrical chapter"],e:"NFPA 70 is the National Electrical Code. The whole country has used one electrical code for a long time. In lecture the IBC was called a where-to code and the NFPA standards how-to codes."},
{s:"C10",t:"ms",c:2,q:"What does Underwriter Laboratory rate?",o:["Assemblies","Structural protection systems","Zoning districts","Occupant loads"],e:"U.L. rates assemblies and rates structural protection systems."},
{s:"C10",t:"mc",q:"In the U.L. fire resistance directory, a design number that starts with X, Y or Z is what kind of assembly?",o:["A column","A floor-ceiling assembly","A wall or partition","A beam"],e:"Columns are X, Y, Z. Walls and partitions are U, V, W. Beams are S and T. Floor-ceiling assemblies start at A. X700-series designs use spray-applied fire-resistive material, rated 1 to 4 hours by thickness."},
{s:"C10",t:"mc",q:"In the 2-hour floor-ceiling design shown in lecture (G032), which component does most of the fire-resistance work?",o:["The acoustical tile ceiling","The concrete topping","The steel joists","The wire fabric"],e:"The ceiling membrane does the majority of the work, because bar joists warp quickly with heat. That is why the holes allowed in a rated ceiling are limited, and why the assembly must be built exactly as tested."},
{s:"C10",t:"mc",q:"Where in the IBC are these found, in order: use groups, type of construction, allowable height and building areas?",o:["Section 302, Table 601, Table 503","Table 601, Section 302, Section 506","Section 504, Table 503, Table 601","Chapter 7, Chapter 9, Chapter 10"],e:"Use groups and occupancies: Section 302. Type of construction: Table 601. Allowable height and building areas: Table 503."},
{s:"C10",t:"mc",q:"Which IBC occupancy group covers business uses, and which covers schools?",o:["Group B for business and Group E for educational","Group E for business and Group B for educational","Group A for business and Group M for educational","Group R for business and Group I for educational"],e:"Section 304 is Business Group B. Group E is Educational."},
{s:"C10",t:"mc",q:"Which occupancy group is a university building such as ECoRE?",o:["Business, Group B","Educational, Group E","Assembly, Group A","Institutional, Group I"],e:"Group E is for K through 12 only, where the contents are predictable. A university building is treated as a business occupancy. Assembly is A and hospitals are I."},
{s:"C10",t:"mc",q:"Which construction type is the most fire resistive, with unlimited height and area?",o:["Type 1A","Type 5B","Type 3B","Type 5A"],e:"Table 601 runs from Type 1 (best) to Type 5. Type 5B has zeros across the table. Type 1A is unlimited in stories and area, which is what a very tall building needs."},
{s:"C10",t:"mc",q:"Under IBC Section 504, what does an approved automatic sprinkler system throughout the building add to the allowable height?",o:["20 feet and one story","10 feet and one story","20 feet and two stories","Nothing, because sprinklers only affect area"],e:"Height is increased by 20 feet and the maximum number of stories by one."},
{s:"C10",t:"mc",q:"How much area increase does an automatic sprinkler system earn?",o:["200% for a multi-story building, 300% for a single-story building","100% for a multi-story building, 200% for a single-story building","300% for a multi-story building, 200% for a single-story building","20% for any building"],e:"200% more area per floor for a multi-story building and 300% for a single-story building, plus 20 ft of height and one story. It used to be 100%."},
{s:"C10",t:"mc",q:"Which occupancies get no sprinkler area increase?",o:["High hazard groups H-1, H-2 and H-3","Business group B","Assembly groups A-1 and A-2","Storage group S-2"],e:"The exception is H-1, H-2 and H-3, the high-hazard occupancies. If a design takes the sprinkler allowance, the building has to be sprinklered."},
{s:"C10",t:"mc",q:"In the area modification formula Aa = A [1 + If/100 + Is/100], what are If and Is?",o:["If is the frontage increase and Is is the sprinkler increase","If is the fire rating and Is is the story count","If is the floor area and Is is the site area","If is the insurance factor and Is is the safety factor"],e:"Section 506: If is the frontage increase and Is is the sprinkler increase, both in percent."},
{s:"C10",t:"mc",q:"How does the perimeter (frontage) increase work?",o:["1% more area for each percent of open perimeter above 25%, modified by the open width between 20 ft and 30 ft","1% more area for each foot of frontage","25% more area for any building on a corner lot","Double the area when all four sides are open"],e:"One percent increase in permitted area for each percent of open perimeter greater than 25%, modified by the width between 20 ft and 30 ft."},
{s:"C10",t:"mc",q:"The frontage increase is If = [F/P − 0.25] × W/30. Why is 0.25 subtracted?",o:["Every building is assumed to front a street on one side, so the first 25% of open perimeter earns no credit","Sprinklers already cover 25% of the perimeter","The code assumes 25% of the perimeter is glass","Fire engines need 25% of the lot"],e:"F is the perimeter that fronts a public way or open space, and P is the whole perimeter. A square downtown building always has its front open, so that quarter is taken away. The most you can earn is 75%."},
{s:"C10",t:"mc",q:"In the frontage formula, how does the open width W count?",o:["30 ft or more counts in full, 20 to 30 ft counts as W/30, and under 20 ft counts for nothing","Any width counts in full","Only widths over 100 ft count","20 ft counts in full and anything wider earns extra"],e:"W/30 is capped at 1. Thirty feet lets a fire engine park away from the building and lean a ladder on it. At 20 ft the multiplier is 2/3, and below 20 ft there is no credit."},
{s:"C10",t:"tf",a:true,q:"Basements need not be counted in the total allowable floor area, provided their total area does not exceed the area permitted for a one-story building above grade plane.",e:"True. That is IBC 506.1.3 as quoted on the 2021 slide."},
{s:"C10",t:"ms",c:3,q:"What are the three ways to handle a mixed-use occupancy?",o:["Build the whole building to the more stringent requirements","One structure with separating fire-rated construction","Two separate structures","Average the requirements of the two uses","Apply the less stringent requirements"],e:"Build to the more stringent requirements, separate the uses with fire-rated construction, or build two separate structures."},
{s:"C10",t:"num",a:2,tol:0,u:"hours",q:"A classroom building (Group B) sits on top of a parking garage (Group S-2) in one structure. What fire rating must the separation between them have?",e:"A 2-hour separation, meaning the floor slab has to last 2 hours in the U.L. furnace test. Building the garage as a separate structure, as at ECoRE, avoids it."},
{s:"C10",t:"mc",q:"Which part of the means of egress leads from an occupied point to an exit?",o:["Exit access","Exit","Exit discharge","Area of refuge"],e:"Exit access (corridors) is the portion that leads from an occupied point to an exit."},
{s:"C10",t:"mc",q:"How does the IBC define the exit itself?",o:["The portion separated from other interior spaces by fire-resistive construction, temporarily as safe as outside","The door to the outside","The corridor leading to a stair","Any path wider than 48 in."],e:"The exit (a stair, for example) is separated from other interior spaces by fire-resistive construction. The slide calls it temporarily as safe as outside."},
{s:"C10",t:"mc",q:"What is the exit discharge?",o:["The portion between the termination of an exit and a public way","The portion from an occupied point to an exit","The enclosed stair","The smoke compartment"],e:"Exit discharge (the door to the outside) is the portion between the termination of an exit and a public way."},
{s:"C10",t:"num",a:50,tol:0,u:"occupants",q:"A space with one means of egress is limited to how many occupants (groups A, B, E, F, M, U)?",e:"50 occupants maximum."},
{s:"C10",t:"mc",q:"What floor area does the occupant load table assign to each person in a business occupancy?",o:["100 ft² gross","40 ft² net","15 ft² net","225 ft² gross"],e:"100 ft² gross per occupant, a 10 ft × 10 ft square each. A courtroom is 40. The same table sets exit width, plumbing fixture counts and outdoor air. A space for more than 50 people needs two ways out, and the two exits must be separated from each other."},
{s:"C10",t:"mc",q:"What is the travel distance limit for occupancy B?",o:["200 ft, or 300 ft if sprinklered","100 ft, or 200 ft if sprinklered","300 ft, or 400 ft if sprinklered","400 ft in all cases"],e:"Total length of travel for occupancy B: 200 feet, 300 if sprinklered."},
{s:"C10",t:"mc",q:"How long may a dead-end corridor be?",o:["20 ft, or 50 ft if sprinklered","50 ft, or 20 ft if sprinklered","30 ft, or 75 ft if sprinklered","200 ft, or 300 ft if sprinklered"],e:"Dead-end corridor: 20 feet max, 50 if sprinklered."},
{s:"C10",t:"ms",c:4,q:"Which requirements apply to an area of refuge?",o:["A 30 in. × 48 in. floor area for a wheelchair","Located in an enclosed stair or smoke compartment","One for each 200 occupants","Two-way communication to a central control point or public phone","A dedicated sprinkler zone","A minimum of 5 footcandles of light"],e:"30 in. × 48 in. per wheelchair, in an enclosed stair or smoke compartment, one for each 200 occupants, with two-way communication."},
{s:"C10",t:"mc",q:"What is the minimum clear door width?",o:["32 in. clear, which means a 36 in. door","36 in. clear, which means a 40 in. door","28 in. clear, which means a 32 in. door","48 in. clear"],e:"Minimum 32 in. clear (36 in. door)."},
{s:"C10",t:"ms",c:2,q:"Which limits apply to a door that swings into the path of egress?",o:["It may not reduce the required exit width by one half during its swing","It may not project more than 7 in. into the required width","It must swing against the direction of travel","It must be held open at all times"],e:"The swing shall not reduce the required exit width by one half, and the door shall not project more than 7 in. into the required width."},
{s:"C10",t:"ms",c:4,q:"Which requirements apply to exit signs?",o:["Illuminated internally or externally to 5 footcandles","Illuminated at all times","90 minutes of battery or generator power","Letters 6 in. high","Letters 12 in. high","Lit only when primary power fails"],e:"5 footcandles, lit at all times, 90 minutes on battery or generator, 6 in. high letters that are 2 in. wide (except the letter I) with ¾ in. strokes."},
{s:"C10",t:"tf",a:false,q:"The code requires exit signs to be red.",e:"False. They can be red or green. Practice is leaning toward green, which reads as go."},
{s:"C10",t:"mc",q:"How does emergency lighting differ from exit sign lighting?",o:["Emergency lighting gives at least 1 footcandle and comes on when primary power fails. Exit signs get 5 footcandles at all times","Emergency lighting gives 5 footcandles at all times. Exit signs get 1 footcandle on power failure","Both give 1 footcandle at all times","Emergency lighting needs 30 minutes of backup. Exit signs need 90"],e:"Emergency lighting: 1 footcandle minimum, illuminated when the primary power source fails. Exit signs: 5 footcandles, at all times. Both need 90 minutes of battery or generator."},
{s:"C10",t:"num",a:90,tol:0,u:"minutes",q:"How long must the battery or generator carry exit signs and emergency lighting?",e:"90 minutes."},
{s:"C10",t:"ms",c:5,q:"Where two exits are required, what must emergency lighting illuminate?",o:["Aisles in rooms and spaces requiring 2 exits","Passageways","Exit access corridors","Exits","Exit discharge","Private offices","Mechanical rooms only"],e:"Aisles in rooms and spaces requiring two exits, passageways, exit access corridors, exits, and exit discharge."},
{s:"C10",t:"mc",q:"Which set of stair dimensions matches the lecture?",o:["48 in. minimum width, 7 in. maximum riser, 4 in. minimum riser, 11 in. minimum tread","36 in. minimum width, 8 in. maximum riser, 4 in. minimum riser, 9 in. minimum tread","48 in. minimum width, 11 in. maximum riser, 7 in. minimum riser, 4 in. minimum tread","44 in. minimum width, 7 in. maximum riser, 6 in. minimum riser, 10 in. minimum tread"],e:"Width 48 in. minimum, riser 7 in. maximum and 4 in. minimum, tread 11 in. minimum."},
{s:"C10",t:"mc",q:"How much may risers and treads vary within a stair?",o:["⅜ in. maximum","1 in. maximum","⅛ in. maximum","Any amount, if the average riser is 7 in."],e:"Stairs must be uniform in size, with a ⅜ in. variation at most."},
{s:"C10",t:"mc",q:"What rule of thumb ties riser height to tread depth?",o:["They should add up to 18 in., so 7 and 11, or 6 and 12","They should be equal","Tread should be twice the riser","They should add up to 24 in."],e:"Remember 7-Eleven: a 7 in. riser with an 11 in. tread. The sum stays at 18 in., so a 6 in. riser gets a 12 in. tread and a 4 in. riser gets 14 in. Nosings need a ½ in. radius."},
{s:"C10",t:"num",a:75,tol:0,u:"ft",q:"Smoke-proof towers are required once a building reaches what height?",e:"75 ft, measured to the floor of the top story. The stair must stay smoke-free, either with a vestibule or balcony that vents the smoke, or with stair pressurization."},
{s:"C10",t:"mc",q:"How is the 75 ft high-rise threshold measured?",o:["From the level of fire department access up to the floor of the highest occupied story","From grade to the top of the roof","From the basement floor to the top floor ceiling","From the street to the top of the parapet"],e:"Stand on the top floor: if that floor is 75 ft or more above the grade where the fire department comes in, the high-rise requirements apply."},
{s:"C10",t:"mc",q:"What pressure does stair pressurization hold in the stair tower relative to adjacent spaces?",o:["0.15 to 0.35 in. of water column, positive","0.15 to 0.35 psi, positive","1 to 2 in. of water column, negative","0.433 psi per foot of height"],e:"The stair tower is under positive pressure of 0.15 to 0.35 in. water column. No vestibule is required, and the fan is activated by the fire alarm system."},
{s:"C10",t:"mc",q:"Why is stair pressurization held between 0.15 and 0.35 in. of water column?",o:["0.15 in. is enough to push smoke back, and above 0.35 in. a small person could not open the door","0.15 in. protects the ductwork, and 0.35 in. is the fan's limit","Below 0.15 in. the fire alarm will not start, and above 0.35 in. sprinklers open","The range matches the pressure in the standpipe"],e:"The low end guarantees smoke is pushed back onto the floor each time a door opens. The high end keeps the door openable. With pressurization no vestibule is needed. The alternative is a vestibule or balcony that lets the smoke leave before it reaches the stair."},
{s:"C10",t:"tf",a:false,q:"Exits and exit corridors may be used as return-air plenums when the building is sprinklered.",e:"False. Exits and exit corridors shall not be used as return air plenum. In lecture: return air may travel above the corridor ceiling, since smoke up there leaves the corridor itself clear. The guest slides state the same corridor rule."},
{s:"C10",t:"mc",q:"What is the area limit for compartmentalization?",o:["150 ft × 150 ft, 22,500 ft²","100 ft × 100 ft, 10,000 ft²","200 ft × 200 ft, 40,000 ft²","225 ft² per compartment"],e:"Area limitation: 150 ft × 150 ft max, 22,500 ft²."},
{s:"C10",t:"ms",c:4,q:"What else does compartmentalization involve?",o:["Smoke partitions","Fire separators","Smoke detectors that close doors","Separate HVAC systems on either side","A shared return-air plenum","A single fire pump per compartment"],e:"Smoke partitions, fire separators, smoke detectors that close the doors, and separate HVAC systems on either side."},
{s:"C10",t:"num",a:1.5,tol:0,u:"hours",q:"A stair enclosure is 2-hour construction. What rating does a door in that wall need, such as the sliding Won-Door at ECoRE?",e:"1½ hours. A door in a 2-hour wall only has to be rated 1½ hours."},
{s:"C10",t:"mc",q:"When does a floor opening become an atrium?",o:["When it connects more than two stories","When it has a skylight","When it is wider than 30 ft","When it connects any two stories"],e:"A two-story vertical opening is permitted. Once the opening connects more than two stories it is an atrium, with smoke exhaust at the top and an enclosure. At ECoRE, sprinklers in front of the glass let the glass wall serve as part of that enclosure."},
{s:"C10",t:"mc",q:"How does an intumescent firestop collar around a pipe work?",o:["Its material expands when heated and fills the opening","It melts and seals the pipe shut with wax","It sprays water on the pipe","It releases a fusible link that drops a damper"],e:"Firestop collars hold intumescent material that swells with heat and closes the hole. Sealant around a penetration does the same job. Once it has expanded it must be replaced."},
{s:"C10",t:"sa",q:"The lecture ends with an exit stair door whose rubber seal was hanging loose. What happened after it was reported, and what is the lesson?",m:"The label showed the door is both a fire door and a smoke door, so it needs its smoke seals to be airtight. Maintenance responded by pulling the gasket off, which left the door no longer smokeproof. The lesson from lecture: the people who maintain a building have to understand it too, and as an engineer you are obligated to report these things for public health and safety."}
]},
{id:"alarm",name:"Fire alarm systems",blurb:"Purpose, initiating devices, indicating devices, auxiliary functions, the control panel and the high-rise code.",qs:[
{s:"FA",t:"ms",c:2,q:"What are the two purposes of a fire alarm system?",o:["Save lives by announcing unsafe conditions","Protect property by alerting the fire department","Put out the fire","Pressurize the stairs"],e:"Save lives by announcing unsafe conditions, and protect property by alerting the fire department."},
{s:"FA",t:"mc",q:"What separates a manual fire alarm system from an automatic one?",o:["Whether the alarm initiating device is operated manually or automatically","Whether the alarm is a bell or a speaker","Whether the panel has standby power","Whether the building is a high-rise"],e:"Manual: the initiating device is operated manually to transmit or sound an alarm signal. Automatic: the initiating device operates automatically."},
{s:"FA",t:"mc",q:"What is the weakness of a purely manual, local fire alarm system?",o:["The alarm sounds in that building only, so someone still has to call the fire department","It cannot ring more than one bell","It needs standby power","It responds only to smoke"],e:"A manual system is in your building only. Nobody else knows, so somebody has to get on the phone. An automatic system works without people intervening."},
{s:"FA",t:"mc",q:"Which of these is a manual initiating device?",o:["A pull station, including glass-break and dual-action types","A fixed-temperature heat detector","An ionization smoke detector","A flame detector"],e:"Manual devices are pull stations. The glass rod stops the mildly curious. Heat, smoke and flame detectors are automatic devices."},
{s:"FA",t:"num",a:5,tol:0,u:"ft",q:"By code, a pull station must be within how many feet of the exit?",e:"5 feet from the exit."},
{s:"FA",t:"mc",q:"What is a dual-action pull station, and what problem does it address?",o:["You lift a cover, which sounds a local buzzer, then pull. It discourages false alarms from vandalism","It rings two bells at once for large buildings","It works on both normal and standby power","It sends the alarm to two fire stations"],e:"Two motions are required. Lifting the plastic cover sets off a buzzer, which is often enough to make a vandal leave before pulling the alarm."},
{s:"FA",t:"ms",c:3,q:"Which statements describe a fixed-temperature heat detector?",o:["It senses abnormally high temperatures","It is the slowest to respond","It has the lowest false alarm rate","It responds in the incipient stage","It senses obscurity"],e:"Senses abnormally high temperatures, slowest to respond, lowest false alarm rate."},
{s:"FA",t:"ms",c:2,q:"Where are fixed-temperature heat detectors used?",o:["Areas where smoke and dirt are a problem","Low-temperature locations","Boiler rooms, where high temperature is normal","Places where a fire starts instantaneously"],e:"Used where smoke and dirt is a problem and in low-temperature locations. Boiler rooms call for rate-of-rise detectors, and instantaneous fires call for flame detectors."},
{s:"FA",t:"mc",q:"What does a rate-of-rise detector sense, and where is it used?",o:["An abnormal rate of heat rise, where high temperature is normally expected, such as a boiler room","Smoke obscuring a light beam, in atriums","Electromagnetic radiation, where fire is instantaneous","A fixed temperature of 135°F, in offices"],e:"Rate-of-rise detectors sense an abnormal rate of heat rise and are used where high temperature can be expected normally, such as a boiler room."},
{s:"FA",t:"num",a:15,tol:0,u:"°F per minute",q:"A rate-of-rise detector alarms when temperature climbs faster than what rate?",e:"More than 15°F per minute."},
{s:"FA",t:"mc",q:"How does an ionization smoke detector work?",o:["Radiation ionizes the air so current flows between electrodes, and particles of combustion attach to the ions and inhibit the current","Smoke scatters a photoelectric beam onto a sensor","A fusible element melts at a set temperature","It senses infrared radiation from flames"],e:"Radiation within the detector ionizes the air and makes it conductive, permitting current flow between electrodes. Particles of combustion attach to the ions and inhibit the current flow."},
{s:"FA",t:"ms",c:2,q:"Which statements describe how an ionization smoke detector performs?",o:["Fast response, in the incipient stage","Prone to false alarms","Slowest to respond","Lowest false alarm rate"],e:"Fast response (incipient stage) and prone to false alarms. Slowest and lowest false alarm rate describe the fixed-temperature heat detector."},
{s:"FA",t:"mc",q:"How does a smoke alarm differ from a smoke detector?",o:["A smoke alarm is self-contained with its own sounder. A smoke detector is an input device that reports to the control panel","A smoke alarm senses heat. A smoke detector senses smoke","A smoke alarm is for commercial buildings. A smoke detector is for homes","They are the same device under two names"],e:"The unit in an apartment has the sensing, the logic and the horn built in. In a commercial system the detector only sends a signal, and the panel knows which address it came from."},
{s:"FA",t:"mc",q:"How does a photoelectric smoke detector work, and which stage does it catch?",o:["Smoke scatters a photoelectric beam (it senses obscurity), in the smoldering stage","Smoke particles inhibit an ion current, in the incipient stage","It senses a rate of heat rise, in the flaming stage","It detects ultraviolet radiation, in instantaneous fires"],e:"Photoelectric detectors sense obscurity: scattering of the photoelectric beam causes the alarm. They suit the smoldering stage."},
{s:"FA",t:"mc",q:"What does the word beam refer to in a beam detector, and where is it used?",o:["A light beam sent across the whole space to a receiver. It suits very large spaces, where a few units replace many spot detectors","The structural beam it mounts on. It suits low ceilings","An infrared beam that senses flames. It suits boiler rooms","A beam of ions. It suits kitchens"],e:"It is a photoelectric detector stretched across the room: a sender at one end and a receiver at the other. Smoke anywhere along the path interrupts it. The guest slides call for beam detectors in atriums."},
{s:"FA",t:"mc",q:"What does a flame detector sense, and where is it used?",o:["Electromagnetic radiation from a fire, where fire occurs instantaneously","Particles of combustion, in bedrooms","Abnormally high temperature, in dirty areas","Water flow, at the zone valve"],e:"Flame detectors detect electromagnetic radiation resulting from a fire and are used where fire occurs instantaneously. The two types are infrared and ultraviolet."},
{s:"FA",t:"mc",q:"Which detector does the lecture call very early warning smoke detection?",o:["ASD, aspirating smoke detection","Fixed-temperature heat detector","Rate-of-rise detector","Manual pull station"],e:"ASD, aspirating smoke detection, is very early warning smoke detection."},
{s:"FA",t:"mc",q:"How does aspirating smoke detection (ASD) work in the ECoRE atrium?",o:["It draws atrium air through small nozzles to detectors in a cabinet, for early warning, and it triggers the atrium smoke exhaust","It sprays a fine mist to wash smoke out of the air","It measures temperature rise at the skylight","It shines a beam across the atrium"],e:"ASD keeps sampling air from the atrium and runs it through detectors. Early detection matters because the building is wide open. It activates the smoke exhaust fans at the top of the atrium, whose power must stay on during a fire."},
{s:"FA",t:"mc",q:"What is the basic requirement for alarm indicating devices?",o:["They must be heard throughout the building","They must be visible from the street","They must stay silent until the fire department arrives","They must sit on every sprinkler branch"],e:"Alarm indicating devices must be heard throughout the building."},
{s:"FA",t:"ms",c:5,q:"Which are alarm indicating devices?",o:["Bell","Horn","Strobe","Speaker (voice command)","Annunciation panel","Pull station","Flow switch"],e:"Bell, horn, strobe, speaker and annunciation panel. Pull stations and flow switches are initiating devices."},
{s:"FA",t:"mc",q:"What are strobes for?",o:["Alerting the hearing impaired, including in public washrooms under the ADA","Lighting the path of egress","Showing which zone is in alarm","Signaling a trouble condition at the panel"],e:"Strobes alert the hearing impaired and go in public washrooms (ADA)."},
{s:"FA",t:"num",a:95,tol:0,u:"dB",q:"How loud is a fire alarm horn?",e:"95 decibels, loud enough to wake a sleeper and to reach people who are slightly hearing impaired."},
{s:"FA",t:"mc",q:"How did voice evacuation messages change after 9/11?",o:["Everyone is now told to leave the building, where some messages used to tell floors to stay in place or relocate","Voice messages were banned in high-rises","Messages now tell occupants to wait for the elevator","Messages are now given only to the fire department"],e:"Before 9/11 some systems directed people by floor and asked others to stay. Now, whatever happens, people are asked to leave the building."},
{s:"FA",t:"mc",q:"What is an annunciation panel?",o:["A display, often near the entrance, that shows where the alarm is when the control panel is somewhere else","The cabinet that holds the CPU and powers the devices","A speaker for voice messages","A strobe for the hearing impaired"],e:"A small display with a keypad that reads out the alarm location. It is separate from the control panel, the brain, which is usually in or behind the front lobby."},
{s:"FA",t:"ms",c:5,q:"Which auxiliary functions can the fire alarm system perform?",o:["Elevator recall","Activate HVAC and smoke evacuation system control","Release smoke doors held on hold-open devices","Discharge extinguishing systems such as deluge","Remote annunciation","Start the jockey pump on a schedule","Reset fusible links"],e:"Elevator recall, HVAC/smoke evacuation control, releasing smoke doors on hold-open devices, discharging extinguishing systems (deluge), and remote annunciation."},
{s:"FA",t:"mc",q:"On alarm the elevators are recalled. Where do they go, and why?",o:["To the ground floor, so the fire department can use them","To the top floor, to keep them above the smoke","To the fire floor, to pick up occupants","They stop where they are with doors open"],e:"Recall brings the cars to the ground floor for the fire department. Firefighters ride to the floor below the fire and work their way up."},
{s:"FA",t:"mc",q:"Besides recall, why should you never take an elevator during a fire?",o:["Smoke at the fire floor can block the door's light beam, so the door stays open and the car is stuck there","Elevator cars are not sprinklered","The elevator shaft is the return-air path","Elevators lose power the moment the alarm sounds"],e:"The door sensor is a light beam. If the car opens at the fire floor, smoke interrupts the beam and the door will not close. The car is not coming anyway, and it cannot carry everyone."},
{s:"FA",t:"ms",c:2,q:"Which are auxiliary initiation devices?",o:["Halon or clean agent system activation","Kitchen hood dry chemical extinguishing system","Manual pull station","Strobe"],e:"Halon/clean agent system activation and the kitchen hood dry chemical extinguishing system both report to the fire alarm."},
{s:"FA",t:"mc",q:"What replaced Halon in computer rooms, and why?",o:["Clean agent gases, because Halon has been outlawed","Deluge sprinklers, because Halon was too slow","Dry chemical, because Halon was too costly","Nothing. Halon is still installed"],e:"Halon is no longer allowed, so substitute gases, called clean agents, do the job. They suppress the fire and still let people breathe long enough to get out. A smoke detector in the room triggers the release."},
{s:"FA",t:"ms",c:4,q:"What does the fire alarm control panel do?",o:["Receives signals from detection devices","Transmits signals to alarm devices, indicating devices and auxiliary equipment","Furnishes normal and standby power to all other fire alarm devices","Supervises the circuitry","Supplies water to the sprinkler zones","Sets the building's occupancy group"],e:"It receives signals, transmits signals, furnishes power (normal and standby) and supervises circuitry. It contains the CPU, relays, switches and circuitry."},
{s:"FA",t:"mc",q:"What are the control panel's three modes of operation?",o:["Normal, trouble, alarm","Standby, active, reset","Manual, automatic, coded","Wet, dry, pre-action"],e:"Normal, trouble and alarm."},
{s:"FA",t:"mc",q:"What puts the control panel into trouble mode?",o:["Faults in wiring or a power failure","A pull station being operated","A sprinkler head opening","Smoke reaching a detector"],e:"Trouble means faults in wiring or power failure. The other three are alarm conditions."},
{s:"FA",t:"mc",q:"What does the control panel do when there is no fire?",o:["It polls every connected device in turn and reports trouble if one fails to answer","It shuts down to save standby power","It tests the horns every hour","It idles until a device sends an alarm"],e:"That is supervision. The panel keeps asking each device, in sequence, whether the connection is good. Working is normal, a failed connection is trouble, and a real event is alarm."},
{s:"FA",t:"mc",q:"How do horns, strobes and detectors get their power?",o:["From the fire alarm control panel, over the system wiring","Each one plugs into a nearby receptacle","From batteries inside each device","From the emergency lighting circuit"],e:"The panel furnishes power to every device, normal and standby, much as an old landline phone was powered through the phone line. The panel itself is about the size of an electrical panel, painted red, usually near the front lobby."},
{s:"FA",t:"ms",c:4,q:"Which alarming methods does the lecture list?",o:["Non-coded, continuous alarm","Coded alarm","Voice alarm","Addressable systems","Single interlock","Rate of rise"],e:"Non-coded continuous alarm, coded alarm, voice alarm, and addressable systems."},
{s:"FA",t:"mc",q:"How does a coded alarm differ from an addressable system?",o:["A coded alarm rings a pattern that tells listeners the location. An addressable system gives every device its own address, so the panel names the exact device","A coded alarm uses voice. An addressable system uses bells","A coded alarm is silent. An addressable system is audible","They are two names for the same thing"],e:"A non-coded alarm just rings. A coded alarm works like Morse code: the pattern identifies the building, floor or device. In an addressable system each device has an address, like an IP address, so firefighters know exactly where to go."},
{s:"FA",t:"mc",q:"Under the high-rise code, the firefighters' control command post needs two-way communication to where?",o:["At least one fire station per floor, all mechanical equipment rooms, elevator machine rooms and air-handling rooms","The main lobby and the roof only","Every office and every stair landing","The fire pump room only"],e:"Two-way active communication from the command post (usually in the lobby) to at least one fire station per floor, all mechanical equipment rooms, elevator machine rooms, and air-handling (fan) rooms."},
{s:"FA",t:"mc",q:"Alert tones and pre-recorded messages go out on independent channels. How are the channels split?",o:["One for paging, another for signal tones","One for each floor","One for fire, another for security","One for the fire department, another for the owner"],e:"Independent channels: one for paging, another for signal tones. A complete system of loudspeakers covering the building is part of it."},
{s:"FA",t:"ms",c:6,q:"Which items does the high-rise code require at the command post? Select all that apply.",o:["Annunciation of all fire alarm devices, including sprinkler valves and water flow indicators","Fire pump status indication","Controls for any automatic stair door unlocking system","Emergency generator status","Elevator location indicators with operation and capture controls","Control of all air-handling units and smoke control devices","The fire department connection","The backflow preventer"],e:"The list also includes communication with the fire department or central station, and a means for testing all circuits and devices."},
{s:"FA",t:"mc",q:"At what height do the high-rise fire alarm requirements start?",o:["When the highest floor is 75 ft or more above fire department access","At 30 ft above fire department access","At 150 ft above grade","At 10 stories, regardless of height"],e:"75 ft, measured to the floor of the highest story. The lecture's point for the exam: know that a building above or below 75 ft is treated differently, and the major things the high-rise code adds."},
{s:"FA",t:"mc",q:"What do the air-handling units do when the fire alarm activates in a high-rise?",o:["Small units shut down, and units big enough go into smoke control mode","All units go to full recirculation","All units keep running normally","All units switch to 100% return air"],e:"Units that are not big enough shut down. Larger ones go into smoke control mode, with doors and dampers closing, and the fire chief can see and control them from the command center."},
{s:"FA",t:"mc",q:"The lecture closes by asking whose responsibility fire protection is. What was the answer?",o:["Everybody: the electrical engineer, the mechanical engineer, the architect and the contractor","The electrical engineer, who designs the fire alarm","The architect alone","The fire department"],e:"It's everybody. The ECoRE examples showed what happens when the team does not pull together and the last details are not carried out."}
]},
{id:"figures",name:"Diagrams and graphs",blurb:"Point out components on system diagrams and read values off graphs. Click a numbered marker to answer.",qs:[
{s:"L11",p:4,t:"pt",fig:"riser",a:[1],q:"Click the backflow preventer.",e:"Marker 1. It sits just inside the building, after the post indicator valve, and keeps fire system water out of the municipal supply. The notes show it as a double-check valve."},
{s:"L11",p:4,t:"pt",fig:"riser",a:[3],q:"Click the jockey pump.",e:"Marker 3, the small pump piped around the fire pump (marker 5). It runs periodically to maintain system pressure."},
{s:"L11",p:4,t:"pt",fig:"riser",a:[4],q:"Click the post indicator valve.",e:"Marker 4, outside the building on the supply from the street main (marker 2). The post shows whether the valve is open."},
{s:"L11",p:4,t:"pt",fig:"riser",a:[6],q:"Click the fire department connection (siamese).",e:"Marker 6, on the outside wall where the pumper truck hooks up. It is the second water source once the fire department arrives."},
{s:"L11",p:4,t:"pt",fig:"riser",a:[9],q:"Click the check valve that keeps water from exiting at the fire department connection.",e:"Marker 9, on the branch to the siamese. Marker 7 is the other check valve, on the fire pump discharge."},
{s:"L11",p:4,t:"pt",fig:"riser",a:[10],q:"Click the outlet where the system must deliver 100 psi.",e:"Marker 10, the top of the riser, which is the most remote outlet. Lower floors are reduced to 85 psi max."},
{s:"L11",p:4,t:"mc",fig:"riser",q:"Water enters at marker 2. In what order does it pass the numbered components on its way to the riser?",o:["2 → 4 → 1 → 5 → 7","2 → 1 → 4 → 5 → 7","2 → 4 → 5 → 1 → 7","2 → 6 → 9 → 5 → 7"],e:"Street main (2), post indicator valve (4), backflow preventer (1), fire pump (5), check valve (7), then the riser."},
{s:"L11",p:10,t:"pt",fig:"branch",a:[1],q:"Click the device that detects water flow in the zone and reports it to the fire alarm.",e:"Marker 1, the flow switch. Its paddle sits in the pipe downstream of the control valve."},
{s:"L11",p:10,t:"pt",fig:"branch",a:[5],q:"Click the device that monitors whether the control valve stays open.",e:"Marker 5, the tamper switch, mounted on the valve and wired to the fire alarm."},
{s:"L11",p:10,t:"pt",fig:"branch",a:[3],q:"Click the OS&Y control valve.",e:"Marker 3. The rising stem shows at a glance whether the valve is open."},
{s:"L11",p:11,t:"pt",fig:"branch",a:[4],q:"Click the test and drain valve.",e:"Marker 4. It drains the zone for service and tests the flow switch. The guest slides list both jobs for the zone valve assembly."},
{s:"L11",p:11,t:"pt",fig:"branch",a:[2],q:"Click the 2½ in. hose valve for fire department use.",e:"Marker 2, on the standpipe riser itself. Marker 6 is a sprinkler head on the branch."},
{s:"L12",p:7,t:"pt",fig:"plan",a:[2],q:"Click the cross main.",e:"Marker 2. The cross main runs from the riser (marker 4) and feeds every branch line."},
{s:"L12",p:7,t:"pt",fig:"plan",a:[3],q:"Click a branch line.",e:"Marker 3. Branch lines carry the heads (marker 1), with 8 heads max on either side of the cross main."},
{s:"L12",p:5,t:"mc",fig:"plan",q:"Count the heads in the plan. By the pipe schedule, what size is the cross main where it leaves the riser?",o:["2½ in.","2 in.","3 in.","1½ in."],e:"Seven branch lines with three heads each is 21 heads. 2 in. pipe stops at 10 sprinklers, and 2½ in. handles up to 30."},
{s:"L11",p:12,t:"pt",fig:"head",a:[3],q:"Click the part that releases at the rated temperature.",e:"Marker 3, the fusible link (a glass bulb in many heads). When it lets go, water leaves the nozzle (marker 1)."},
{s:"L11",p:12,t:"pt",fig:"head",a:[2],q:"Click the deflector.",e:"Marker 2. The deflector breaks the stream from the nozzle into a spray."},
{s:"FA",t:"pt",fig:"alarm",a:[3],q:"Click the manual initiating device.",e:"Marker 3, the pull station. By code it sits within 5 ft of the exit."},
{s:"FA",t:"pt",fig:"alarm",a:[1],q:"Click the indicating device that alerts hearing-impaired occupants.",e:"Marker 1, the horn strobe. The strobe is the visual signal, and it is also required in public washrooms."},
{s:"FA",t:"pt",fig:"alarm",a:[5],q:"Click the detector made for a very large open space.",e:"Marker 5, the beam detector: a sender and a receiver with a light beam between them. Marker 4 is a spot smoke detector."},
{s:"FA",t:"pt",fig:"alarm",a:[2],q:"Click the brain of the system, which powers and supervises every device.",e:"Marker 2, the fire alarm control panel."},

    b+='<path class="fa" d="M'+x0+' '+(y0+4)+'a4 4 0 0 1 4 -4h44a4 4 0 0 1 4 4V250H'+x0+'Z"/>'+T(c,270,labs[i],"middle");});
  b+=L("ax",60,250,570,250)+TV(16,145,"% of casualties");
  FIGS.tod={w:600,h:284,body:b,cap:"Fire casualties by time of day (Lecture 10.1)",hs:[]};

  /* stages of fire */
  var pts=[[80,249],[170,244],[260,231],[350,200],[430,140],[520,60]];
  b='<path class="ax" d="M50 20V260H570"/><path class="fw" d="'+smooth([[50,250]].concat(pts,[[548,36]]))+'"/>';
  pts.forEach(function(p){b+='<circle class="pt" cx="'+p[0]+'" cy="'+p[1]+'" r="5"/>';});
  b+=T(310,284,"Time","middle")+TV(26,140,"Fire size (schematic)");
  FIGS.stages={w:600,h:296,body:b,cap:"Fire growth over time, with the six stages marked in order",
    hs:pts.map(function(p){return [p[0]-10,p[1]-24,p[0]-2,p[1]-6];})};
})();
function figure(q,done){
  var f=FIGS[q.fig],live=q.t==="pt"&&!done,s="";
  s+='<svg viewBox="0 0 '+f.w+' '+f.h+'" role="img" aria-label="'+f.cap+'" style="max-width:'+f.w+'px;min-width:'+Math.min(460,f.w)+'px">'+f.body;
  f.hs.forEach(function(p){if(p.length>2)s+=L("lead",p[0],p[1],p[2],p[3]);});
  f.hs.forEach(function(p,i){
    var n=i+1,cls="hs";
    if(q.t==="pt"){var sel=st.ans[q.id]===n,right=q.a.indexOf(n)>=0;
      if(done){if(right)cls+=" ok";else if(sel)cls+=" no";}else{cls+=" live";if(sel)cls+=" sel";}}
    s+='<g class="'+cls+'" data-n="'+n+'"'+(live?' tabindex="0" role="button" aria-label="Marker '+n+'"':'')+'><circle cx="'+p[0]+'" cy="'+p[1]+'" r="12"/><text x="'+p[0]+'" y="'+p[1]+'">'+n+'</text>'+(live?'<circle class="hit" cx="'+p[0]+'" cy="'+p[1]+'" r="18"/>':'')+'</g>';
  });
  s+="</svg>";
  var wrap=h("div",{class:"fig"});wrap.innerHTML=s;
  if(live){Array.prototype.forEach.call(wrap.querySelectorAll(".hs"),function(g){
    function pick(){st.ans[q.id]=+g.getAttribute("data-n");save();refresh(q);var t=document.querySelector("#"+q.id+" .hs.sel");if(t)t.focus({preventScroll:true});}
    g.addEventListener("click",pick);
    g.addEventListener("keydown",function(ev){if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();pick();}});});}
  return h("div",{class:"figwrap"},wrap,h("p",{class:"figcap",text:f.cap}));
}

/* ---------- question card ---------- */
var TYPE={mc:"Choose one",tf:"True or false",ms:"Select all that apply",num:"Numeric answer",sa:"Short answer, self-graded",pt:"Click a marker on the diagram"};
function srcLabel(q){return SRC[q.s]+(q.p?" · notes p. "+q.p:"");}
function card(q){
  var done=isDone(q),ok=done&&correct(q),study=st.mode==="study";
  var el=h("section",{class:"card"+(done?(ok?" right":" wrong"):""),id:q.id,"aria-label":"Question "+q.n});
  el.append(h("div",{class:"qmeta"},
    h("span",{class:"qnum",text:"Q"+q.n}),
    h("span",{class:"pill src",text:srcLabel(q)}),
    h("span",{class:"pill",text:TYPE[q.t]}),
    q.b?h("span",{class:"pill blank",text:"Blank in your notes"}):null,
    done?h("span",{class:"pill "+(ok?"ok":"no"),text:ok?"Correct":(q.t==="sa"?"Missed":(answered(q)?"Incorrect":"Not answered"))}):null));
  el.append(h("p",{class:"prompt",text:q.q}));
  if(q.fig)el.append(figure(q,done));

  if(q.t==="mc"||q.t==="ms"||q.t==="tf"){
    var opts=q.t==="tf"?["True","False"]:q.o;
    var order=q.t==="tf"?[0,1]:perm(opts.length,hash(q.id));
    var fs=h("fieldset",{class:"opts"});
    fs.append(h("legend",{style:"position:absolute;left:-9999px",text:"Options for question "+q.n}));
    order.forEach(function(oi){
      var val=q.t==="tf"?(oi===0):oi;
      var chosen=q.t==="ms"?(Array.isArray(st.ans[q.id])&&st.ans[q.id].indexOf(oi)>=0):st.ans[q.id]===val;
      var right=q.t==="mc"?oi===0:q.t==="tf"?val===q.a:oi<q.c;
      var cls="opt";
      if(done){cls+=" locked";if(right)cls+=" is-right";else if(chosen)cls+=" is-wrong";}
      var inp=h("input",{type:q.t==="ms"?"checkbox":"radio",name:q.id,id:q.id+"-o"+oi,disabled:done});
      inp.checked=!!chosen;
      inp.addEventListener("change",function(){
        if(q.t==="ms"){var cur=Array.isArray(st.ans[q.id])?st.ans[q.id].slice():[];var ix=cur.indexOf(oi);
          if(inp.checked&&ix<0)cur.push(oi);if(!inp.checked&&ix>=0)cur.splice(ix,1);st.ans[q.id]=cur;}
        else st.ans[q.id]=val;
        save();updateChrome();var b=el.querySelector("[data-check]");if(b)b.disabled=!answered(q);});
      fs.append(h("label",{class:cls,"for":q.id+"-o"+oi},inp,h("span",{text:opts[oi]})));
    });
    el.append(fs);
  }
  if(q.t==="num"){
    var ni=h("input",{type:"text",inputmode:"decimal",id:q.id+"-n",autocomplete:"off",disabled:done,"aria-label":"Answer in "+q.u});
    ni.value=st.ans[q.id]||"";
    ni.addEventListener("input",function(){st.ans[q.id]=ni.value;save();updateChrome();var b=el.querySelector("[data-check]");if(b)b.disabled=!answered(q);});
    ni.addEventListener("keydown",function(ev){if(ev.key==="Enter"&&study&&answered(q)){st.done[q.id]=true;save();refresh(q);}});
    el.append(h("div",{class:"numrow"},ni,h("span",{text:q.u})));
  }
  if(q.t==="sa"){
    var ta=h("textarea",{id:q.id+"-t",placeholder:"Write your answer, then compare it with the model answer.","aria-label":"Your answer"});
    ta.value=st.ans[q.id]||"";
    ta.addEventListener("input",function(){st.ans[q.id]=ta.value;save();});
    el.append(ta);
  }

  var act=h("div",{class:"actions"});
  if(q.t==="sa"){
    var reveal=st.shown[q.id]||st.graded||done;
    if(!reveal&&study)act.append(h("button",{class:"btn",type:"button",onclick:function(){st.shown[q.id]=true;save();refresh(q);}},"Show model answer"));
    if(reveal&&!done){
      act.append(h("button",{class:"btn good",type:"button",onclick:function(){st.self[q.id]=1;save();refresh(q);}},"I had it"));
      act.append(h("button",{class:"btn bad",type:"button",onclick:function(){st.self[q.id]=0;save();refresh(q);}},"I missed it"));
    }
  } else if(study&&!done){
    act.append(h("button",{class:"btn",type:"button","data-check":"1",disabled:!answered(q),onclick:function(){st.done[q.id]=true;save();refresh(q);}},"Check answer"));
  }
  if(done&&!st.graded){
    act.append(h("button",{class:"btn ghost",type:"button",onclick:function(){delete st.done[q.id];delete st.self[q.id];delete st.shown[q.id];delete st.ans[q.id];save();refresh(q);}},"Try again"));
  }
  if(act.childNodes.length)el.append(act);

  var showFb=done||(q.t==="sa"&&(st.shown[q.id]||st.graded));
  if(showFb){
    var fb=h("div",{class:"fb"});
    if(q.t==="num")fb.append(h("p",{class:"ans",text:"Answer: "+fmt(q.a)+" "+q.u+(q.tol?"  (accepted within ±"+q.tol+")":"")}));
    if(q.t==="pt")fb.append(h("p",{class:"ans",text:"Answer: marker "+q.a.join(" or ")}));
    if(q.t==="mc")fb.append(h("p",{class:"ans",text:"Answer: "+q.o[0]}));
    if(q.t==="tf")fb.append(h("p",{class:"ans",text:"Answer: "+(q.a?"True":"False")}));
    if(q.t==="sa"){fb.append(h("span",{class:"lab",text:"Model answer"}));fb.append(h("p",{text:q.m}));}
    else fb.append(h("p",{text:q.e}));
    el.append(fb);
  }
  return el;
}
function refresh(q){var old=document.getElementById(q.id);if(old)old.replaceWith(card(q));updateChrome();}

/* ---------- views ---------- */
var current="overview";
function viewIds(){return ["overview"].concat(SECTIONS.map(function(s){return s.id;}),["results"]);}
function go(id,qid){if(viewIds().indexOf(id)<0)id="overview";current=id;
  try{if(location.hash!=="#"+id)history.replaceState(null,"","#"+id);}catch(e){}
  render();
  var target=qid?document.getElementById(qid):null;
  if(target)target.scrollIntoView();else window.scrollTo(0,0);}
function sectionNav(i){
  var prev=i>0?SECTIONS[i-1]:null,next=i<SECTIONS.length-1?SECTIONS[i+1]:null;
  return h("div",{class:"next"},
    prev?h("button",{class:"btn ghost",type:"button",onclick:function(){go(prev.id);}},"← "+prev.name):h("span"),
    h("button",{class:"btn",type:"button",onclick:function(){go(next?next.id:"results");}},next?next.name+" →":"See results →"));
}
function overview(){
  var rows=SECTIONS.map(function(s,i){var srcs={};s.qs.forEach(function(q){srcs[SRC[q.s]]=1;});
    return h("tr",null,h("td",{class:"num",text:String(i+1)}),h("td",null,h("a",{href:"#"+s.id,text:s.name})),h("td",{text:Object.keys(srcs).join(", ")}),h("td",{class:"num",text:String(s.qs.length)}));});
  return [
    h("div",{class:"sec-head"},h("h2",{text:"Overview"}),h("p",{text:"A review test built from the thirteen files in this project: lecture slides, your note packets and two lecture transcripts. Every question names the lecture it came from, and every answer comes with an explanation."})),
    h("div",{class:"panel"},h("h3",{text:"Sections"}),
      h("div",{class:"tablewrap"},h("table",null,h("thead",null,h("tr",null,h("th",{class:"num",text:"No."}),h("th",{text:"Section"}),h("th",{text:"Drawn from"}),h("th",{class:"num",text:"Questions"}))),h("tbody",null,rows))),
      h("div",{class:"actions"},h("button",{class:"btn",type:"button",onclick:function(){go(SECTIONS[0].id);}},"Start section 1 →"))),
    h("div",{class:"panel"},h("h3",{text:"How it works"}),h("ul",null,
      h("li",{text:"Study mode checks each answer as you go. Exam mode holds all feedback until you grade the test on the Results page."}),
      h("li",{text:"Select-all questions are all or nothing. Numeric questions accept a small rounding tolerance. Short answers show a model answer and you mark yourself."}),
      h("li",{text:"Diagram questions ask you to point something out. Click a numbered marker on the drawing, then check it."}),
      h("li",{text:"Progress is saved in this browser. Results lists every miss with a link back to the question."}))),
    h("div",{class:"panel"},h("h3",{text:"How source conflicts are settled"}),h("ul",null,
      h("li",{text:"Where a lecture and the guest slides disagree, the guest slides are the answer. That covers the standpipe maximum flow (1,000 GPM sprinklered, 1,250 GPM non-sprinklered), the head temperature rating (135 to 155°F), the fire pump driver (almost always electric) and the residential share of fire deaths (75%)."}),
      h("li",{text:"Each of those explanations also names the older lecture figure, so you recognize it if it comes up."}),
      h("li",{text:"The flow-test example states its pressures as givens. No question asks you to read a pressure off either graph."}),
      h("li",{text:"A source tag with a notes page points to your handwritten note packet. The rest point to the lecture slides."})))
  ];
}
function results(){
  var t=tally(ALL),pct=t.done?Math.round(100*t.right/t.done):0,out=[];
  out.push(h("div",{class:"sec-head"},h("h2",{text:"Results"}),h("p",{text:st.graded?"The whole test is graded. Unanswered questions count as misses.":"Scores count the questions you have checked so far."})));
  var saLeft=ALL.filter(function(q){return q.t==="sa"&&st.self[q.id]===undefined;}).length;
  var p=h("div",{class:"panel"});
  p.append(h("div",{class:"bigscore"},h("b",{text:t.right+" / "+t.done}),h("span",{text:pct+"% of checked questions · "+(t.total-t.done)+" of "+t.total+" not yet checked"})));
  if(st.graded&&saLeft)p.append(h("p",{text:saLeft+" short-answer questions still need you to compare with the model answer and mark yourself."}));
  var acts=h("div",{class:"actions"});
  if(!st.graded)acts.append(h("button",{class:"btn",type:"button",onclick:function(){st.graded=true;save();render();}},"Grade the whole test now"));
  acts.append(h("button",{class:"btn ghost",type:"button",onclick:function(){
    ALL.forEach(function(q){if(isDone(q)&&!correct(q)){delete st.ans[q.id];delete st.done[q.id];delete st.self[q.id];delete st.shown[q.id];}});
    if(st.graded){ALL.forEach(function(q){if(q.t!=="sa"&&answered(q))st.done[q.id]=true;});st.graded=false;}
    save();render();}},"Retry the questions I missed"));
  var armed=false;
  var resetBtn=h("button",{class:"btn ghost",type:"button"},"Start over");
  resetBtn.addEventListener("click",function(){if(!armed){armed=true;resetBtn.textContent="Click again to erase all answers";return;}
    st={ans:{},done:{},self:{},shown:{},mode:st.mode,graded:false};save();go("overview");});
  acts.append(resetBtn);p.append(acts);out.push(p);

  function table(title,groups){
    var rows=groups.map(function(g){var x=tally(g.qs),w=x.total?100*x.right/x.total:0;
      return h("tr",null,h("td",null,g.id?h("a",{href:"#"+g.id,text:g.name}):g.name),
        h("td",{class:"num",text:x.right+" / "+x.done}),h("td",{class:"num",text:String(x.total)}),
        h("td",null,h("div",{class:"bar"},h("i",{class:"ok",style:"width:"+w+"%"}))));});
    return h("div",{class:"panel"},h("h3",{text:title}),h("div",{class:"tablewrap"},h("table",null,
      h("thead",null,h("tr",null,h("th",{text:"Group"}),h("th",{class:"num",text:"Correct / checked"}),h("th",{class:"num",text:"Questions"}),h("th",{text:"Correct of all"}))),h("tbody",null,rows))));
  }
  out.push(table("By section",SECTIONS));
  out.push(table("By source",Object.keys(SRC).map(function(k){return {name:SRC[k],qs:ALL.filter(function(q){return q.s===k;})};})));

  var miss=ALL.filter(function(q){return isDone(q)&&!correct(q);});
  var mp=h("div",{class:"panel"},h("h3",{text:"Questions to revisit ("+miss.length+")"}));
  if(!miss.length)mp.append(h("p",{text:t.done?"No misses among the questions checked so far.":"Nothing checked yet. Answer some questions, then come back here."}));
  else{var list=h("div",{class:"missed"});miss.forEach(function(q){
    list.append(h("button",{type:"button",onclick:function(){go(q.sec.id,q.id);}},h("span",{class:"k",text:"Q"+q.n}),h("span",{text:q.q})));});mp.append(list);}
  out.push(mp);
  return out;
}
function render(){
  var main=document.getElementById("main");main.textContent="";
  if(current==="overview")overview().forEach(function(n){main.append(n);});
  else if(current==="results")results().forEach(function(n){main.append(n);});
  else{var i=SECTIONS.findIndex(function(s){return s.id===current;}),sec=SECTIONS[i];
    main.append(h("div",{class:"sec-head"},h("h2",{text:(i+1)+". "+sec.name}),h("p",{text:sec.blurb})));
    sec.qs.forEach(function(q){main.append(card(q));});
    main.append(sectionNav(i));}
  updateChrome();
}
function updateChrome(){
  var rail=document.getElementById("rail");rail.textContent="";
  function link(id,n,name,c){rail.append(h("a",{href:"#"+id,"aria-current":current===id?"true":"false"},h("span",{class:"n",text:n}),h("span",{text:name}),h("span",{class:"c",text:c})));}
  link("overview","·","Overview","");
  SECTIONS.forEach(function(s,i){var x=tally(s.qs);link(s.id,String(i+1),s.name,x.done?x.right+"/"+x.done:x.answered+"/"+x.total);});
  var t=tally(ALL);link("results","✓","Results",t.done?Math.round(100*t.right/t.done)+"%":"");
  document.getElementById("tbQ").textContent=String(ALL.length);
  document.getElementById("tbS").textContent=String(SECTIONS.length);
  document.getElementById("tbScore").textContent=t.right+" / "+t.done;
  document.getElementById("meterText").textContent="Answered "+t.answered+" of "+t.total+" · "+t.right+" correct of "+t.done+" checked";
  document.getElementById("meterBar").style.width=(100*t.answered/t.total)+"%";
  document.getElementById("modeStudy").setAttribute("aria-pressed",String(st.mode==="study"));
  document.getElementById("modeExam").setAttribute("aria-pressed",String(st.mode==="exam"));
}
document.getElementById("modeStudy").addEventListener("click",function(){st.mode="study";save();render();});
document.getElementById("modeExam").addEventListener("click",function(){st.mode="exam";save();render();});
window.addEventListener("hashchange",function(){var id=location.hash.slice(1);if(id!==current){current=viewIds().indexOf(id)>=0?id:"overview";render();window.scrollTo(0,0);}});
(function(){var id=location.hash.slice(1);current=viewIds().indexOf(id)>=0?id:"overview";render();})();
</script>
